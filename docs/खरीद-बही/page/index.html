<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* layout: a munim's ledger — ruled rows, ink-blue headings, red for anything that needs Vikram ji's eye; tabs for bills / item rates / questions / app check */
:root{--bg:#f4f6f9;--card:#ffffff;--fg:#17202e;--mut:#5d6878;--line:#d9dfe8;--ink:#23408e;--inkS:#e6ebf7;--red:#b42318;--redS:#fdecea;--ok:#13795b;--okS:#e3f4ec;--amb:#a15c07;--ambS:#fdf1de;
 --disp:"Tiro Devanagari Hindi","Hind",serif;--body:"Hind",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--fg:#e4e9f1;--mut:#9aa6b8;--line:#2a3443;--ink:#8fa8f0;--inkS:#1f2a45;--red:#f07b6f;--redS:#3a1d1b;--ok:#4fc79b;--okS:#15302a;--amb:#f2b45a;--ambS:#352814;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--fg:#e4e9f1;--mut:#9aa6b8;--line:#2a3443;--ink:#8fa8f0;--inkS:#1f2a45;--red:#f07b6f;--redS:#3a1d1b;--ok:#4fc79b;--okS:#15302a;--amb:#f2b45a;--ambS:#352814;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.w{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.2;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(28px,6vw,38px)}h2{font-size:22px}
.sub{color:var(--mut);margin:2px 0 0;max-width:64ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 20px var(--mono)}.tile span{font-size:13px;color:var(--mut)}.tile.red b{color:var(--red)}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:600 14.5px var(--body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bill{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line)}
.bh h3{font-size:19px}.bh .meta{color:var(--mut);font-size:13.5px}.bh .tot{margin-left:auto;font:700 18px var(--mono)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--body);padding:2px 9px;border-radius:999px}
.chip.pending{background:var(--ambS);color:var(--amb)}.chip.ok{background:var(--okS);color:var(--ok)}.chip.missing,.chip.diff{background:var(--redS);color:var(--red)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px var(--body);color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--inkS)}
td.r,th.r{text-align:right;white-space:nowrap}
td .orig{display:block;color:var(--mut);font-size:12px}
.up{color:var(--red)}.dn{color:var(--ok)}
.ask{display:block;color:var(--red);font-size:12.5px}
.bf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--inkS)}
.bf .lbl{font-size:13px;color:var(--mut)}
.bf button{font:600 13.5px var(--body);padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bf button.on{border-color:currentColor}.bf button.ok.on{color:var(--ok)}.bf button.missing.on{color:var(--red)}
.note{color:var(--mut);font-size:13.5px;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.q{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.q:last-child{border:0}.q b{font:700 14px var(--mono);color:var(--red);min-width:24px}
.srch{width:100%;font:15px var(--body);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);box-sizing:border-box}
.it{border-bottom:1px solid var(--line);padding:9px 0}.it:last-child{border:0}
.ih{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.ih b{font-weight:700}.ih .num{margin-left:auto}
.hist{font-size:13px;color:var(--mut);margin-top:3px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.alert{background:var(--redS);color:var(--red);border-radius:12px;padding:10px 14px;font-weight:600}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.4 var(--mono);background:var(--inkS);padding:10px;border-radius:10px;max-height:200px;overflow:auto;margin:8px 0}
.cp{font:600 14px var(--body);padding:8px 14px;border-radius:10px;border:0;background:var(--ink);color:var(--card);cursor:pointer}
.form{display:flex;flex-direction:column;gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--mut)}.fl input,.fl select,.fl textarea{font:15px var(--body);padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:480px){.row2{grid-template-columns:1fr}}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}.ph b{font-size:14px}.ph small{color:var(--mut);font-size:12px}
.ph .thumbs{display:flex;gap:4px;flex-wrap:wrap}.ph .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph label{font:600 13px var(--body);padding:6px 10px;border-radius:9px;background:var(--inkS);color:var(--ink);cursor:pointer}
.big{font:700 16px var(--body);padding:12px 16px;border-radius:12px;border:0;background:var(--ink);color:var(--card);cursor:pointer;width:100%}.big:disabled{opacity:.5}
.big.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.edt td:first-child{min-width:170px}.edt td:not(:first-child) input{width:70px}.edt input{width:100%;box-sizing:border-box;font:14px var(--body);padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.done{background:var(--okS);color:var(--ok);border-radius:12px;padding:14px;font-weight:600}
.pics{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px}.pics img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.chk td input{width:70px}
</style>
<div class="w">
<header><h1>177 MH खरीद-बही</h1><p class="sub" id="sub">खरीद का हर बिल, फोटो और भुगतान एक जगह।</p></header>
<div class="tiles" id="tiles" hidden></div>
<div id="warn"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="view"><div class="empty">बिल लोड हो रहे हैं…</div></main>
</div>
<script>
/* दो रूप: 👑 मालिक (विक्रम जी — सब बिल, साथियों की खरीद, भाव, सवाल, ऐप-मिलान) · 🛒 साथी (सिर्फ़ नई खरीद डालें + आज का माल मिलाएँ; पुराना कुछ नहीं दिखता)
   डेटा: bills (बही, सिर्फ़ मालिक) · buys/<साथी-id>/e (साथी की खरीद, वह खुद + मालिक) · buys/<id>/p (फोटो, छोटी JPEG) · inbox (माल मिलाने की छोटी सूची, बिना भाव, 3 दिन) */
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs=n=>"₹"+(Math.round((+n||0)*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const fd=d=>{if(!d)return "";const [y,m,dd]=String(d).split("-");return dd+"-"+m+"-"+y};
const today=()=>{const d=new Date(Date.now()+5.5*3600e3);return d.toISOString().slice(0,10)};
const ST={pending:"⏳ ऐप में चढ़ना बाकी",ok:"✅ ऐप में चढ़ा",missing:"❌ ऐप में नहीं चढ़ा",diff:"⚠ ऐप में अलग रकम"};
const PAY={cash:"💵 नकद",upi:"📲 UPI/QR",udhar:"📒 उधार",vikram:"👑 विक्रम जी ने दिया"};
let BILLS=[],BUYS=[],tab="",q="",db=null,sample=null,role=null,me={id:"",name:""},loaded=false;
const LSg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
/* ---------- हिसाब ---------- */
function lineCost(b,l){const g=+b.gst||0,sub=(b.lines||[]).reduce((a,x)=>a+(+x.amt||0),0)||1,fr=(+b.freight||0)*((+l.amt||0)/sub);const amt=(+l.amt||0)*(1+(l.gstIn?0:g/100))+fr;return (+l.qty)?amt/(+l.qty):0}
/* 🏷️ पहचान: बारकोड सबसे पहले (हर दुकान नाम अलग लिखती है, बारकोड एक ही रहता है) → फिर ऐप id → फिर नाम।
   किसी भी बिल में नाम+बारकोड साथ आए तो उस नाम वाली बाकी लाइनें भी उसी बारकोड से जुड़ जाती हैं। */
const nk=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9\u0900-\u097F]+/g," ").trim(),bcN=s=>String(s||"").replace(/\D/g,"");
function keyMap(){const M={n:{},i:{},ni:{},in:{}};BILLS.forEach(b=>(b.lines||[]).forEach(l=>{const c=bcN(l.bc),n=nk(l.nm||l.n);if(c.length>=8){if(n&&!M.n[n])M.n[n]=c;if(l.iid&&!M.i[l.iid])M.i[l.iid]=c}if(l.iid&&n){if(!M.ni[n])M.ni[n]=l.iid;if(!M.in[l.iid])M.in[l.iid]=n}}));return M}
function keyOf(l,M){M=M||keyMap();const c=bcN(l.bc);if(c.length>=8)return "B"+c;const n=nk(l.nm||l.n);if(M.n[n])return "B"+M.n[n];const id=l.iid||M.ni[n];if(id&&M.i[id])return "B"+M.i[id];return "N"+((id&&M.in[id])||n)}
function history(){const H={},M=keyMap();[...BILLS].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(b=>(b.lines||[]).forEach(l=>{const k=keyOf(l,M);(H[k]=H[k]||[]).push({date:b.date,sup:b.sup,no:b.no,uc:lineCost(b,l),u:l.u,qty:l.qty,id:b.id,nm:l.nm||l.n||"",bc:bcN(l.bc)})}));return H}
const keyLbl=(k,L)=>{const m=nk(L[L.length-1].nm),o=[...new Set(L.map(x=>nk(x.nm)).filter(x=>x&&x!==m))];return m+(k[0]==="B"?" · 🏷️"+k.slice(1):"")+(o.length?" (दूसरे नाम: "+o.join(", ")+")":"")};
function prevOf(H,b,l){const L=H[keyOf(l)]||[];const i=L.findIndex(x=>x.id===b.id);return i>0?L[i-1]:null}
function allQs(){const o=[];BILLS.forEach(b=>{(b.ask||[]).forEach(a=>o.push({b,t:a}));(b.lines||[]).forEach(l=>{if(l.ask)o.push({b,t:(l.nm||l.n)+" — "+l.ask})})});return o}
const newBuys=()=>BUYS.filter(x=>x.st!=="booked"&&x.st!=="reject");
/* 🔺 महँगा: बही की पिछली खरीद (1 का पड़ा) से तुलना — ₹ और % दोनों */
function lastUC(l,before){const H=history()[keyOf(typeof l==="string"?{nm:l}:l)]||[];const L=H.filter(x=>!before||x.date<before||(x.date===before&&false));return L.length?L[L.length-1]:null}
function dearOf(lines,date){return (lines||[]).map(l=>{const p=lastUC(l,date);const r=+l.uc||+l.rate||0;if(!p||!(p.uc>0)||!(r>p.uc+0.009))return null;return {nm:l.nm,from:p.uc,to:r,d:r-p.uc,pct:(r-p.uc)/p.uc*100,date:p.date,sup:p.sup}}).filter(Boolean)}
const dearTxt=x=>`${esc(x.nm)} ${rs(x.from)} → ${rs(x.to)} (+${rs(x.d)}, +${x.pct.toFixed(1)}%)`;
/* ---------- फोटो: छोटा करके (≤1280px, ~150 KB) ---------- */
async function shrink(file,max=1280,q0=.7){const u=URL.createObjectURL(file);try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  let qq=q0,d=c.toDataURL("image/jpeg",qq);while(d.length>220000&&qq>.35){qq-=.08;d=c.toDataURL("image/jpeg",qq)}return d}finally{setTimeout(()=>URL.revokeObjectURL(u),3000)}}
const toBlob=d=>{const [h,b]=d.split(","),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})};
/* ---------- 👑 मालिक: बही ---------- */
function tiles(){const t=$("#tiles");if(role!=="owner"||tab==="today"){t.hidden=true;if(role==="owner")warnOnly();return}t.hidden=false;const tot=BILLS.reduce((a,b)=>a+(+b.total||0),0),pend=BILLS.filter(b=>b.app!=="ok").length,nb=newBuys().length;
  t.innerHTML=`<div class="tile"><b class="num">${BILLS.length}</b><span>बिल</span></div><div class="tile"><b class="num">${rs(tot)}</b><span>कुल खरीद</span></div><div class="tile ${pend?"red":""}"><b class="num">${pend}</b><span>ऐप में चढ़ना बाकी</span></div><div class="tile ${nb?"red":""}"><b class="num">${nb}</b><span>साथियों की नई खरीद</span></div>`;
  const miss=BILLS.filter(b=>b.app==="missing"||b.app==="diff");$("#warn").innerHTML=miss.length?`<div class="alert">❌ ${miss.length} बिल ऐप में नहीं चढ़े या रकम अलग है: ${miss.map(b=>esc(b.sup+" #"+b.no)).join(", ")} — साथी से आज ही चढ़वाएँ।</div>`:""}
function warnOnly(){const miss=BILLS.filter(b=>b.app==="missing"||b.app==="diff");$("#warn").innerHTML=miss.length?`<div class="alert">❌ ${miss.length} बिल ऐप में नहीं चढ़े या रकम अलग है: ${miss.map(b=>esc(b.sup+" #"+b.no)).join(", ")}</div>`:""}
function billsHTML(){if(!BILLS.length)return `<div class="box empty">अभी कोई बिल नहीं। चैट में बिल की फोटो भेजें, या साथी "🛒 नई खरीद" से डालें।</div>`;const H=history();
  return [...BILLS].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.no).localeCompare(String(a.no))).map(b=>{const ap=b.app||"pending";
  return `<article class="bill"><div class="bh"><h3>${esc(b.sup)}</h3><span class="meta">बिल #${esc(b.no)} · ${fd(b.date)}${b.buyer?" · "+esc(b.buyer):""}${b.byName?" · 🛒 "+esc(b.byName):""}${b.pay?" · "+esc(PAY[b.pay]||b.pay):""}${b.gst?" · GST "+b.gst+"%":""}</span><span class="chip ${ap}">${ST[ap]}</span><span class="tot num">${rs(b.total)}</span></div>
  <div class="tw"><table><thead><tr><th>सामान</th><th class="r">मात्रा</th><th class="r">रेट</th><th class="r">रकम</th><th class="r">1 का पड़ा</th><th class="r">पिछली बार</th></tr></thead><tbody>
  ${(b.lines||[]).map(l=>{const uc=lineCost(b,l),p=prevOf(H,b,l),d=p&&p.uc?((uc-p.uc)/p.uc*100):null;
    return `<tr><td><b>${esc(l.nm||l.n)}</b>${l.nm&&l.n&&l.nm!==l.n?`<span class="orig">बिल पर: ${esc(l.n)}</span>`:""}${l.ask?`<span class="ask">❓ ${esc(l.ask)}</span>`:""}</td><td class="r num">${esc(l.qty)} ${esc(l.u||"")}</td><td class="r num">${rs(l.rate)}</td><td class="r num">${rs(l.amt)}</td><td class="r num"><b>${rs(uc)}</b>/${esc(l.u||"")}</td><td class="r num">${p?`${rs(p.uc)} <span class="${uc>p.uc+0.009?"up":uc<p.uc-0.009?"dn":""}">${uc>p.uc+0.009?"▲ +"+rs(uc-p.uc)+" ("+d.toFixed(1)+"%)":uc<p.uc-0.009?"▼ "+rs(p.uc-uc)+" ("+Math.abs(d).toFixed(1)+"%)":"="}</span><span class="orig">${fd(p.date)}</span>`:"पहली बार"}</td></tr>`}).join("")}
  </tbody></table></div>
  <div class="bf"><span class="lbl">ऐप में:</span>${["ok","missing","pending"].map(k=>`<button type="button" class="${k}${ap===k?" on":""}" data-st="${k}" data-id="${esc(b.id)}" aria-pressed="${ap===k}">${k==="ok"?"✅ चढ़ गया":k==="missing"?"❌ नहीं चढ़ा":"⏳ अभी पता नहीं"}</button>`).join("")}${b.appNote?`<span class="note">${esc(b.appNote)}</span>`:""}</div></article>`}).join("")}
function itemsHTML(){const H=history(),K=Object.keys(H).filter(k=>!q||(keyLbl(k,H[k])).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>keyLbl(a,H[a]).localeCompare(keyLbl(b,H[b])));
  return `<div class="box"><input class="srch" id="srch" type="search" placeholder="🔍 सामान या बारकोड खोजें (PANEER, 8901…)" value="${esc(q)}" aria-label="सामान खोजें">
  ${K.map(k=>{const L=H[k],last=L[L.length-1],mn=Math.min(...L.map(x=>x.uc)),mx=Math.max(...L.map(x=>x.uc));
    return `<div class="it"><div class="ih"><b>${esc(keyLbl(k,L))}</b><span class="note">${L.length} बार · ${esc(last.sup)}</span><span class="num"><b>${rs(last.uc)}</b>/${esc(last.u||"")}</span></div>
    <div class="hist">${L.length>1?`सबसे कम ${rs(mn)} · सबसे ज़्यादा ${rs(mx)} · `:""}${L.slice().reverse().map(x=>`${fd(x.date)}: ${rs(x.uc)} (${esc(x.qty)} ${esc(x.u||"")}, #${esc(x.no)})`).join(" · ")}</div></div>`}).join("")||`<p class="empty">${q?"यह सामान किसी बिल में नहीं":"अभी कोई सामान नहीं"}</p>`}</div>`}
function qsHTML(){const Q=allQs();return `<div class="box">${Q.length?Q.map((x,i)=>`<div class="q"><b>${i+1}.</b><div>${esc(x.t)}<span class="note" style="display:block">${esc(x.b.sup)} #${esc(x.b.no)} · ${fd(x.b.date)}</span></div></div>`).join(""):`<p class="empty">कोई सवाल बाकी नहीं</p>`}
  <p class="note" style="margin-top:8px">चैट में बस नंबर के साथ जवाब दें, जैसे "1 — 1 पैकेट में 50 प्लेट" — Claude यहाँ ठीक कर देगा।</p></div>`}

/* ---------- 🧠 याद (mem — साथी पढ़ सकें, सिर्फ़ मालिक लिखे; भाव कभी नहीं): ऐप की सामान-सूची, पैकेट में कितने, दुकानें ---------- */
let CAT=[],PACKS={},SHOPS={};
async function loadMem(){try{const s=await db.collection("mem").get();const c=[];s.docs.forEach(d=>{const v=d.data()||{};if(/^cat\d+$/.test(d.id))c.push(...(v.items||[]));if(d.id==="packs")PACKS=v.m||{};if(d.id==="shops")SHOPS=v.m||{}});CAT=c}catch(e){}}
const fpOf=(shop,no,date,total)=>{const s=String(shop||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16)||"DUKAN";const n=String(no||"").replace(/[^A-Za-z0-9]/g,"");/* बिल नंबर हो तो नंबर + कुल रकम (दुकान का नाम हर कोई अलग लिखता है), न हो तो दुकान + तारीख + रकम */return (n?"B"+n+"-"+Math.round(+total||0):s+"-"+String(date||"").replace(/-/g,"")+"-"+Math.round(+total||0)).slice(0,60)};
async function saveCat(txt){let j;try{const a=txt.indexOf("{");j=JSON.parse(txt.slice(a,txt.lastIndexOf("}")+1))}catch(e){alertMsg("कोड सही नहीं");return}if(j.app!=="mh177-cat"||!Array.isArray(j.items)){alertMsg("यह ऐप की सामान-सूची का कोड नहीं");return}
  const L=j.items.map(x=>({i:String(x.i||"").slice(0,40),n:String(x.n||"").slice(0,40),u:String(x.u||"pc").slice(0,6),...(x.pp?{pp:+x.pp}:{}),...(x.pk?{pk:String(x.pk).slice(0,40)}:{}),...(x.b?{b:String(x.b).replace(/\D/g,"").slice(0,20)}:{})})).filter(x=>x.i&&x.n);
  const old=(await db.collection("mem").get()).docs.filter(d=>/^cat\d+$/.test(d.id)).map(d=>d.id);const N=Math.ceil(L.length/400);
  for(let k=0;k<N;k++)await db.doc("mem/cat"+k).set({items:L.slice(k*400,k*400+400),ts:Date.now()});for(const id of old)if(+id.slice(3)>=N)await db.doc("mem/"+id).delete();
  CAT=L;alertMsg("✓ "+L.length+" सामान याद हो गए — अब AI बिल की लाइन ऐप के सही सामान से जोड़ेगा");render()}
async function learn(x){/* बही में चढ़ाते समय: पैकेट-गिनती और दुकान याद */const pk={...PACKS},sh={...SHOPS};let ch=false;
  (x.lines||[]).forEach(l=>{if(+l.pp>0&&l.nm&&pk[l.nm]!==+l.pp){pk[l.nm]=+l.pp;ch=true}});if(x.shop&&!sh[x.shop]){sh[x.shop]={ph:x.phone||"",ts:Date.now()};ch=true}
  if(ch){PACKS=pk;SHOPS=sh;try{await db.doc("mem/packs").set({m:pk});await db.doc("mem/shops").set({m:sh})}catch(e){}}}

    ask:[...(x.ask||[]),...(x.ans?["साथी का जवाब: "+x.ans]:[]),...(x.ib&&x.ib.chk&&x.ib.chk.short?["माल कम मिला: "+x.ib.chk.short]:[])],lines:(x.lines||[]).map(l=>({n:l.nm,nm:l.nm,qty:l.qty,u:l.u,rate:l.rate,amt:l.amt,...(l.ask?{ask:l.ask}:{}),...(l.iid?{iid:l.iid}:{}),...(l.pp?{pp:l.pp}:{}),...(l.bc?{bc:String(l.bc)}:{})}))};
  if(x.st==="changed"&&x.bill){b.app="pending";b.reBooked=Date.now();try{await db.doc("bills/"+x.bill).update({...b,changedAfter:true});await db.doc("buys/"+u+"/e/"+id).update({st:"booked"});x.st="booked";render()}catch(e){alertMsg("बही में नहीं बदला")}return}
  if(BILLS.some(y=>y.id===bid)){alertMsg("यह बिल ("+bid+") बही में पहले से है — दोहरी एंट्री का शक!");return}
  try{await db.doc("bills/"+bid).set(b);await db.doc("buys/"+u+"/e/"+id).update({st:"booked",bill:bid});x.st="booked";learn(x);render()}catch(e){alertMsg("बही में नहीं चढ़ा")}}
async function showPics(key){const [u,id]=key.split("|"),box=document.querySelector(`[data-pics="${CSS.escape(key)}"]`);if(!box)return;box.innerHTML=`<span class="note">⏳</span>`;
  try{const s=await db.collection("buys/"+u+"/p").where("e","==",id).get();box.innerHTML=s.docs.map(d=>{const v=d.data();const t={bill:"🧾",card:"🪪",goods:"📦",qr:"🔳"}[v.k]||"";return /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v.d||"")?`<img src="${v.d}" alt="${t} फोटो" data-zoom title="${t}">`:""}).join("")||"<span class='note'>फोटो नहीं मिली</span>"}catch(e){box.innerHTML="<span class='note'>फोटो नहीं खुली</span>"}}
/* ---------- रेंडर ---------- */
function tabsFor(){return role==="owner"?[["today","📅 आज"],["buys","📥 साथियों की खरीद"+(newBuys().length?" ("+newBuys().length+")":"")],["bills","🧾 बही"],["items","📈 भाव"],["qs","❓ सवाल"],["app","📲 ऐप में भेजो"],["mem","🧠 याद"]]:[["new","🛒 नई खरीद"],["chat","💬 चैट से"]]}
function render(){if(!role)return;tiles();const T=tabsFor();if(!T.some(t=>t[0]===tab))tab=T[0][0];
  $("#tabs").innerHTML=T.map(([k,v])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${v}</button>`).join("");
  $("#sub").textContent=role==="owner"?"👑 विक्रम जी — हर बिल की पक्की नकल, साथियों की भेजी खरीद, पड़ता भाव, पिछली खरीद से तुलना, और ऐप में चढ़ा या नहीं।":"🛒 खरीद करके यहाँ बिल, दुकान, सामान और QR की फोटो डालें, भुगतान लिखें, भेजें — बस। पुरानी खरीद यहाँ नहीं दिखती।";
  const v=$("#view");v.innerHTML=role==="owner"?(tab==="today"?todayHTML():tab==="buys"?buysHTML():tab==="items"?itemsHTML():tab==="qs"?qsHTML():tab==="app"?appHTML():tab==="mem"?memHTML():billsHTML()):(tab==="inbox"?inboxHTML():tab==="chat"?chatHTML():staffHTML())}
function alertMsg(m){$("#warn").innerHTML=`<div class="alert">${esc(m)}</div>`;setTimeout(()=>{if(role==="owner")tiles();else $("#warn").innerHTML=""},6000)}
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let b;
  if((b=g("[data-t]"))){tab=b.dataset.t;LSs("kb_tab_"+role,tab);render();return}
  if(g("[data-zoom]")){const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${e.target.src}" alt="बड़ी फोटो">`;z.onclick=()=>z.remove();document.body.appendChild(z);return}
  if((b=g("[data-st]"))&&role==="owner"){const id=b.dataset.id,v=b.dataset.st;const x=BILLS.find(y=>y.id===id);if(!x||x.app===v)return;const old=x.app;x.app=v;render();try{await db.doc("bills/"+id).update({app:v,appTs:Date.now()})}catch(err){x.app=old;render();alertMsg("सेव नहीं हुआ")}return}
  if((b=g("[data-book]"))){book(b.dataset.book);return}
  if((b=g("[data-rej]"))){const [u,id]=b.dataset.rej.split("|");try{await db.doc("buys/"+u+"/e/"+id).update({st:"reject"});const x=BUYS.find(y=>y.uid===u&&y.id===id);if(x)x.st="reject";render()}catch(err){alertMsg("सेव नहीं हुआ")}return}
  if((b=g("[data-loadph]"))){showPics(b.dataset.loadph);return}
  if(g("[data-ai]")){readBill();return}
  if((b=g("[data-send]"))){sendF(b);return}
  if(g("[data-newf]")){F=blank();saveF();render();return}
  if((b=g("[data-edit]"))){const x=MINE.find(y=>y.id===b.dataset.edit);if(!x)return;F={...blank(),editId:x.id,shop:x.shop||"",phone:x.phone||"",billNo:x.billNo||"",date:x.date,pay:x.pay||"cash",paid:x.paid||"",payTo:x.payTo||"",note:x.note||"",lines:(x.lines||[]).map(l=>({...l})),ask:x.ask||[],ans:x.ans||"",total:x.total||0,aiWarn:x.aiWarn||""};tab="new";render();scrollTo(0,0);return}
  if(g("[data-rename]")){me.name="";LSs("kb_name","");render();return}
  if((b=g("[data-chk]"))){doChk(b.dataset.chk);return}
  if(g("[data-savecat]")){saveCat(($("#catIn")||{}).value||"");return}
  if(g("[data-bookall]")){for(const x of newBuys().filter(y=>!y.dupOf))await book(x.uid+"|"+x.id);return}
  if(g("[data-cpchat]")){const txt=chatPrompt();try{await navigator.clipboard.writeText(txt);$("#cpm2").textContent="✓ कॉपी हो गया — अब Claude की नई चैट में चिपकाएँ"}catch(_){const r=document.createRange();r.selectNodeContents($("#cpTxt"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$("#cpm2").textContent="संदेश चुन लिया — कॉपी दबाएँ"}return}
  if(e.target.id==="cp"){const txt=appJSON();try{await navigator.clipboard.writeText(txt);$("#cpm").textContent="✓ कॉपी हो गया"}catch(_){const r=document.createRange();r.selectNodeContents($("#aj"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$("#cpm").textContent="कोड चुन लिया — कॉपी दबाएँ"}}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="srch"){q=t.value;const p=t.selectionStart;render();const n=$("#srch");if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}return}
  if(!F)return;const m={fShop:"shop",fPhone:"phone",fNo:"billNo",fDate:"date",fPay:"pay",fPaid:"paid",fPayTo:"payTo",fNote:"note",fAns:"ans"};if(m[t.id]){F[m[t.id]]=t.value;saveF();const s=$("[data-send]");if(s)s.disabled=!(Object.values(F.ph).some(x=>x.length)||F.shop);return}
  if(t.id==="fName"){me.name=t.value.trim().slice(0,30);LSs("kb_name",me.name);return}
  if(t.dataset.ln){const l=F.lines[+t.dataset.ln];if(!l)return;l[t.dataset.f]=t.dataset.f==="nm"?t.value.toUpperCase():(+t.value||0);if(t.dataset.f!=="nm"){l.amt=Math.round(l.qty*l.rate*100)/100;F.total=F.lines.reduce((a,x)=>a+(+x.amt||0),0)}saveF()}});
document.addEventListener("change",async e=>{const t=e.target;if(t.id==="fPay"){F.pay=t.value;saveF();return}if(!t.dataset.slot||!t.files)return;
  const first=t.dataset.slot==="bill"&&!F.ph.bill.length;for(const f of [...t.files].slice(0,6)){try{F.ph[t.dataset.slot].push(await shrink(f))}catch(_){}}render();
  /* बिल की पहली फोटो आते ही AI अपने-आप पढ़े — बटन दबाना ज़रूरी नहीं */if(first&&sample&&!F.lines.length)readBill()});
render();

  else{clearTimeout(tm);loaded=true;await loadF();if(!me.name&&me.id){try{const d=await db.doc("buys/"+me.id).get();const v=d.data&&d.data();if(v&&v.name){me.name=v.name;LSs("kb_name",me.name)}}catch(e){}}
    try{sample=await claude.use("sample")}catch(e){sample=null}
    if(me.id&&me.name){db.doc("buys/"+me.id).get().then(d=>{if(!(d&&d.exists))db.doc("buys/"+me.id).set({name:me.name,last:Date.now()}).catch(()=>{})}).catch(()=>{})}
    await loadMem();await loadMine();render()}})();
