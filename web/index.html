<title>177 MH कैंटीन</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: mandi-cart POS — sticky header + tabs, photo-tile grid, haldi-yellow total bar fixed at the bottom, sheets slide up */
:root{
  --bg:#f3f6ef; --surface:#ffffff; --ink:#14281d; --muted:#5d6f63; --line:#d9e3d4;
  --leaf:#1d6a44; --leaf-ink:#ffffff; --haldi:#f4b81c; --haldi-ink:#2a1d00;
  --chili:#c42f28; --chili-bg:#fde8e6; --sky:#1f5fa6; --sky-bg:#e5effa; --ok-bg:#e3f3e8;
  --ts:72%; --tl1:90%; --tl2:76%;
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(20,40,29,.06),0 6px 18px rgba(20,40,29,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1712; --surface:#16221b; --ink:#e6efe8; --muted:#94a89a; --line:#273a2f;
  --leaf:#46b97c; --leaf-ink:#06140c; --haldi:#f5c53e; --haldi-ink:#231800;
  --chili:#f0675d; --chili-bg:#3a1714; --sky:#7fb3ee; --sky-bg:#14263b; --ok-bg:#163223;
  --ts:40%; --tl1:30%; --tl2:20%; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1712; --surface:#16221b; --ink:#e6efe8; --muted:#94a89a; --line:#273a2f;
  --leaf:#46b97c; --leaf-ink:#06140c; --haldi:#f5c53e; --haldi-ink:#231800;
  --chili:#f0675d; --chili-bg:#3a1714; --sky:#7fb3ee; --sky-bg:#14263b; --ok-bg:#163223;
  --ts:40%; --tl1:30%; --tl2:20%; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--leaf)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--leaf);color:var(--leaf-ink);padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.logo i{font-style:normal;width:36px;height:36px;border-radius:12px;background:var(--haldi);display:grid;place-items:center;font-size:20px}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.8;letter-spacing:.04em}
.who{border:1px solid color-mix(in srgb,var(--leaf-ink) 35%,transparent);background:transparent;color:var(--leaf-ink);border-radius:99px;padding:4px 12px;font-size:13px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--leaf-ink);opacity:.75;padding:8px 12px 10px;font-weight:700;font-size:15px;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--haldi)}
main{padding-block:12px 140px}
.demo{background:var(--sky-bg);color:var(--sky);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.inst[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--surface)}
.chip.ud[aria-pressed="true"]{background:var(--chili);border-color:var(--chili);color:var(--surface)}
.cust{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.cust select{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--muted)}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.96)}
.tile{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,hsl(var(--h) var(--ts) var(--tl1)),hsl(var(--h) var(--ts) var(--tl2)));overflow:hidden}
.tile .em{font-size:50px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22))}
.tile img{width:100%;height:100%;object-fit:cover}
.card .nm{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;padding:7px 9px 0}
.card .pr{padding:0 9px 8px;font-size:14px;color:var(--muted)}
.card .pr b{color:var(--ink);font-size:15px}
.card.off{opacity:.45}
.badge{position:absolute;top:6px;right:6px;background:var(--haldi);color:var(--haldi-ink);font-weight:800;font-size:12px;border-radius:99px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cartbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:18px;background:var(--haldi);color:var(--haldi-ink);padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cartbtn .t{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.cartbtn .c{font-size:13px;font-weight:600;text-align:left}
.cartbtn .go{font-weight:800;font-size:16px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,15,9,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-head .tile{width:72px;border-radius:16px;flex:none}
.sh-head .tile .em{font-size:40px}
.sh-head h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1}
.x{margin-left:auto;border:0;background:var(--bg);border-radius:99px;width:36px;height:36px;font-size:18px;flex:none}
.qchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qchips button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 4px;font-weight:700;font-size:16px}
.qchips button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stepper button{width:52px;height:52px;border-radius:14px;border:0;background:var(--bg);font-size:26px;font-weight:700;flex:none}
.stepper .qv{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
.inp.bad{border-color:var(--chili);background:var(--chili-bg)}
.amtline{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px dashed var(--line);margin-bottom:10px}
.amtline b{font-family:var(--f-display);font-size:30px}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:18px;background:var(--leaf);color:var(--leaf-ink)}
.big.haldi{background:var(--haldi);color:var(--haldi-ink)}
.big.ghost{background:var(--bg);color:var(--ink)}
.big:disabled{opacity:.45}
.warn{background:var(--chili-bg);color:var(--chili);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:10px}
.lines{list-style:none;margin:0 0 8px;padding:0}
.lines li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lines .em{font-size:26px;width:32px;text-align:center}
.lines .mid{flex:1;min-width:0}
.lines .mid b{display:block;font-size:16px}
.lines .mid span{font-size:13px;color:var(--muted)}
.lines .mid span.chg{color:var(--chili);font-weight:700}
.lines .am{font-weight:800;font-size:16px}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;width:30px}
.paym{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 12px}
.paym button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:800;font-size:16px}
.paym button[aria-pressed="true"]{border-color:var(--leaf);background:var(--ok-bg)}
.paym button:disabled{opacity:.4}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--sky-bg);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center}
.qrbox .qr{background:#ffffff;padding:12px;border-radius:14px}
.qrbox .qr img,.qrbox .qr canvas{display:block}
.qrbox b{font-family:var(--f-display);font-size:26px;color:var(--sky)}
.done{text-align:center;padding:10px 0 4px}
.done .tick{width:64px;height:64px;border-radius:99px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-size:34px;margin:0 auto 8px}
.receipt{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 12px;font-size:14px}
.receipt h4{margin:0;text-align:center;font-family:var(--f-display);font-size:20px}
.receipt .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin:4px 0 8px;flex-wrap:wrap}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:4px 0;border-bottom:1px dotted var(--line)}
.receipt td.r{text-align:right}
.receipt .tot td{font-weight:800;font-size:17px;border:0;padding-top:8px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.big{display:block;text-align:center;text-decoration:none}
/* panels */
h2.sec{font-family:var(--f-display);font-size:22px;margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.kpi.hero{grid-column:1/-1;background:var(--leaf);color:var(--leaf-ink)}
.kpi.hero span{color:inherit;opacity:.85}
.kpi.hero b{font-size:34px}
.kpi.red b{color:var(--chili)}
.kpi.blue b{color:var(--sky)}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block}
.li .mid span{font-size:13px;color:var(--muted)}
.li .rt{text-align:right;font-weight:800}
.li .rt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.red{background:var(--chili-bg);color:var(--chili)}
.pill.blue{background:var(--sky-bg);color:var(--sky)}
.pill.green{background:var(--ok-bg);color:var(--leaf)}
.tblwrap{overflow-x:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right}
table.t tr.flag td{background:var(--chili-bg)}
.daterow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.daterow .inp{width:auto}
.setitem{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.setitem .tile{width:56px;border-radius:12px;border:0;padding:0}
.setitem .tile .em{font-size:30px}
.setitem .flds{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;min-width:0}
.setitem .flds .inp{padding:7px 8px;font-size:15px}
.setitem .flds2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.setitem .flds2 .inp{width:auto;padding:5px 8px;font-size:14px}
.stk{position:absolute;top:6px;left:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font-weight:700;font-size:11px;border-radius:99px;padding:2px 7px}
.stk.low{background:var(--chili);color:var(--surface)}
.cinp{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;padding:4px 0}
.cinp+.cinp{border-left:1px solid var(--line);padding-left:8px}
.lnk{border:0;background:none;color:var(--sky);font-weight:700;text-decoration:underline;padding:0;font-size:13px}
.heldrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.heldrow button{flex:none;border:1.5px dashed var(--sky);background:var(--sky-bg);color:var(--sky);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;text-align:left}
.amtchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.amtchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 2px;font-weight:700;font-size:15px}
.freebtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px;font-weight:600;font-size:14px;margin-bottom:12px;color:var(--muted)}
.freebtn[aria-pressed="true"]{border-color:var(--chili);color:var(--chili);background:var(--chili-bg)}
.card2{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.card2 h3{margin:0;font-family:var(--f-display);font-size:19px}
.stkrow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.stkrow:last-child{border-bottom:0}
.stkrow .tile{width:44px;border-radius:10px}
.stkrow .tile .em{font-size:24px}
.stkf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stkf .inp{padding:6px 6px;font-size:15px}
.stkf label{font-size:11px}
.stkmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;min-width:0;background:var(--leaf);border-radius:4px 4px 0 0;position:relative}
.bars div.zero{background:var(--line)}
.barlbl{display:flex;gap:3px;font-size:10px;color:var(--muted);padding:3px 4px 0}
.barlbl span{flex:1;min-width:0;text-align:center;overflow:hidden}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.btabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px;border-top:1px solid color-mix(in srgb,var(--leaf-ink) 18%,transparent)}
.btab{flex:none;cursor:pointer;display:flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--leaf-ink) 40%,transparent);background:transparent;color:var(--leaf-ink);border-radius:12px;padding:5px 6px 5px 10px;font-weight:700;font-size:13px;line-height:1.15;text-align:left;max-width:170px}
.btab span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab small{display:block;font-weight:800;font-size:15px}
.btab[aria-pressed="true"]{background:var(--haldi);color:var(--haldi-ink);border-color:var(--haldi)}
.btab .bx{border:0;background:transparent;color:inherit;opacity:.7;font-size:15px;width:24px;height:24px;flex:none;padding:0}
.btab.new{border-style:dashed;padding:5px 12px;font-size:14px}
.udbox{border:2px solid var(--chili);border-radius:16px;padding:12px;margin-bottom:12px;display:grid;gap:8px;background:var(--chili-bg)}
.udbox b{color:var(--chili);font-size:16px}
.udbox .inp{background:var(--surface)}
.udlist{display:grid;gap:6px}
.udlist button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.udlist button span{font-weight:500;font-size:13px;color:var(--muted)}
.row3{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.lock{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:12px;padding:10px 12px;font-size:14px}
.lock b{font-size:16px;word-break:break-all}
.scanbtn{flex:none;border:0;border-radius:12px;background:var(--leaf);color:var(--leaf-ink);font-weight:800;padding:0 14px;font-size:15px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
/* v5 compact layout */
.logo{font-size:20px}.logo i{width:30px;height:30px;border-radius:10px;font-size:17px}
header{padding-block:6px 0}
.tabs{margin-top:6px}.tabs button{padding:6px 10px 8px;font-size:14px}
.btabs{padding:6px 0 8px}.btab{padding:3px 4px 3px 8px;font-size:12px}.btab small{font-size:14px}
main{padding-block:10px 120px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.grid .card{border-radius:14px}
.grid .tile{aspect-ratio:5/4}
.grid .tile .em{font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.grid .card .nm{font-size:14px;padding:5px 7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .card .pr{padding:0 7px 6px;font-size:12px}.grid .card .pr b{font-size:14px}
.grid .badge{font-size:11px;padding:1px 6px}.grid .stk{font-size:10px;padding:1px 5px}
.grid.rows{grid-template-columns:1fr;gap:6px}
.grid.rows .card{flex-direction:row;align-items:center;gap:4px;padding-right:10px}
.grid.rows .tile{width:46px;aspect-ratio:1;flex:none;border-radius:10px;margin:5px}
.grid.rows .tile .em{font-size:24px}
.grid.rows .card .nm{flex:1;min-width:0;padding:0;font-size:16px}
.grid.rows .card .pr{padding:0;font-size:13px}.grid.rows .card .pr b{font-size:16px}
.grid.rows .badge{position:static;order:3;margin-left:6px}.grid.rows .stk{position:static;order:2}
.qq{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;margin-bottom:8px}
.qq.on{border-color:var(--haldi);background:color-mix(in srgb,var(--haldi) 14%,var(--surface))}
.qq label{font-weight:700;font-size:14px;white-space:nowrap}
.qq input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:800;padding:4px 2px}
.qq button{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;min-width:38px;height:36px;font-weight:800;font-size:15px;padding:0 6px}
.qq button.clr{border-color:var(--chili);color:var(--chili)}
.qqhint{font-size:13px;font-weight:700;color:var(--haldi-ink);background:var(--haldi);border-radius:10px;padding:5px 10px;margin:-2px 0 8px}
.searchrow{margin-bottom:8px}.search{padding:9px 12px}
/* v7 compact header + search on top */
.brand{justify-content:flex-start;gap:8px}
.lg{font-style:normal;flex:none;width:30px;height:30px;border-radius:9px;background:var(--haldi);display:grid;place-items:center;font-size:17px}
.brand .tabs{flex:1;min-width:0;margin-top:0}
.brand .tabs button{padding:8px 9px 9px}
.who{flex:none;max-width:28%;padding:3px 10px;font-size:12px}
#sbar{display:flex;gap:6px;margin:4px 0 0}
#sbar .search{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:0;border-radius:12px;font-size:17px;padding:9px 12px}
#sbar .scanbtn{background:var(--haldi);color:var(--haldi-ink);padding:0 12px;font-size:18px}
.qtip{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--muted)}
.qtip.go{background:var(--haldi);color:var(--haldi-ink);border-radius:10px;padding:6px 10px}
.modes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.modes .chip{padding:5px 12px;font-size:13px}
.cats{margin-bottom:8px}.cats .chip{padding:4px 11px;font-size:13px}
.cust{padding:6px 10px;margin-bottom:8px}
.qscrim{position:fixed;inset:0;z-index:20;background:rgba(5,15,9,.5)}
.qpop{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:21;max-width:520px;margin:0 auto;background:var(--surface);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.4);padding:12px;display:grid;gap:10px;animation:qdn .15s ease-out}
@keyframes qdn{from{transform:translateY(-10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.qpop{animation:none}}
.qh{display:flex;align-items:center;gap:10px}.qh .tile{width:52px;border-radius:12px;flex:none}.qh .tile .em{font-size:28px}
.qn{flex:1;min-width:0}.qn b{display:block;font-family:var(--f-display);font-size:21px;line-height:1.1}.qn span{font-size:14px;color:var(--muted)}
.qrow{display:flex;align-items:center;gap:8px}
.qf{flex:1;min-width:0;display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;padding:2px 12px;background:var(--bg)}
.qf:focus-within{border-color:var(--haldi)}
.qf input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-family:var(--f-display);font-weight:800;font-size:26px;padding:6px 0;color:var(--ink)}
.qf span{font-weight:700;color:var(--muted);font-size:15px;flex:none}
.or{font-size:13px;color:var(--muted);flex:none}
.qchips2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qchips2 button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-weight:800;font-size:16px}
.qpop .big{padding:13px;font-size:17px}
/* v9 customer strip */
.btabs{overflow:visible;align-items:center;gap:8px}
#bts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0;max-width:52%}
.btab.new{padding:5px 10px;font-size:18px;font-weight:800}
.bcust{flex:1 1 0;min-width:0;display:flex;align-items:stretch;background:var(--surface);color:var(--ink);border-radius:12px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bcust label{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:4px;padding:0 6px;border-radius:10px}
.bcust label:first-child{flex-grow:1.25}
.bcust label+label{border-left:1px solid var(--line)}
.bcust label:focus-within{background:color-mix(in srgb,var(--haldi) 20%,var(--surface))}
.bcust .ic{flex:none;font-size:15px;line-height:1}
.bcust input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:8px 0;font-variant-numeric:tabular-nums}
.bcust input::placeholder{color:var(--muted);font-weight:600}
.bcust.pill{align-items:center;padding:8px 10px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.custinfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--haldi) 22%,var(--surface));border:1.5px solid var(--haldi);border-radius:12px;padding:7px 10px;margin-bottom:8px;font-size:13px;font-weight:600}
.custinfo .lnk{font-size:13px}
/* v14 Android ऐप */
.lgform{display:grid;gap:10px;width:min(340px,100%)}
.lgerr{color:var(--chili);font-weight:700;margin:0}.lgmsg{color:var(--leaf);font-weight:700;margin:0}
.lgphone{font-size:30px;font-weight:800;letter-spacing:2px;min-height:40px;font-variant-numeric:tabular-nums}
.camov{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:16px}
.camov video{width:100%;max-width:520px;border-radius:18px}
.camframe{position:absolute;left:50%;top:42%;width:min(70vw,360px);height:160px;transform:translate(-50%,-50%);border:3px solid #7CFC9A;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.camov p{margin:0;font-weight:700;text-align:center}.camov .big{width:min(340px,100%);background:#fff}
.verline{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 4px}
/* v15 खरीद, लेबल */
.supsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.supsel b{font-size:17px}.supsel .lnk{margin-left:auto}.supsel .tile{width:40px;height:40px}
.plines{display:grid;gap:8px}.pline{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px;border:1.5px solid var(--line);border-radius:14px}
.pf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:end}.pf .inp{padding:8px;font-size:17px}.pamt{font-size:18px;padding:8px 0;display:block}
.pbadge{margin-top:4px;min-height:4px}
.ppick{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}.ppick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 4px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink)}
.ppick .tile{width:46px;height:46px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}.dgrid span{background:var(--bg);border-radius:8px;padding:3px 5px;font-size:11px;color:var(--muted)}.dgrid b{display:block;color:var(--ink);font-size:13px}
.nrow{display:grid;grid-template-columns:44px 1fr 110px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.nrow .note{display:block}.nrow .inp{font-size:20px;font-weight:800;text-align:center}
.lsws{display:flex;flex-wrap:wrap;gap:6px 12px}.lsw{display:flex;align-items:center;gap:5px}
.lprev{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/16px 16px;border-radius:12px;padding:10px;display:flex;justify-content:center}.lprev canvas{max-width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);border-radius:4px}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
/* v16 ग्राफ़ */
.ti{font-size:15px}
.chart{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.chart h3{margin:0 0 2px;font-size:16px}.chart .note{margin:0 0 6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mixbar{display:flex;height:26px;border-radius:9px;overflow:hidden;margin:6px 0}.mixbar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap}
.hbar{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.hbar .t{background:var(--bg);border-radius:6px;height:16px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--leaf);border-radius:6px}.hbar b{text-align:right}
/* v18 कागज़ की रसीद */
.pp-slot{position:relative;padding-top:10px}
.pp-printer{height:14px;margin:0 6px;border-radius:10px;background:linear-gradient(#2b2f36,#4a505a);box-shadow:inset 0 -3px 0 #1c1f24}
.paper{position:relative;margin:-6px 14px 18px;background:#fffefa;color:#1b1b1b;padding:18px 16px 22px;font-family:"Mukta",system-ui,sans-serif;box-shadow:0 10px 24px rgba(0,0,0,.18);border-radius:2px}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,#fffefa 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,#fffefa 0) 0 0/14px 10px repeat-x}
.pp-anim{animation:ppIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes ppIn{from{transform:translateY(-70%);clip-path:inset(70% 0 0 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
.pp-head{text-align:center;display:grid;gap:0}.pp-head .pp-logo{font-size:30px;line-height:1}.pp-head b{font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:800;letter-spacing:.3px}.pp-head small{color:#555;font-size:12px}
.pp-rule{height:2px;background:#1b1b1b;margin:10px 0 8px}
.pp-dash{border-top:1.5px dashed #9a9a9a;margin:8px 0}
.pp-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#333;flex-wrap:wrap}.pp-meta b{color:#000}
.pp-t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.pp-t th{font-size:12px;color:#555;font-weight:700;text-align:left;padding:2px 3px}.pp-t td{padding:5px 3px;vertical-align:top;border-bottom:1px dotted #ddd}
.pp-t .r{text-align:right;white-space:nowrap}.pp-t tr[data-edit]{cursor:pointer}.pp-t tr[data-edit]:active{background:#f3f7ef}
.pp-x{border:0;background:#fde8e8;color:#c62828;border-radius:8px;width:26px;height:26px;font-weight:800}
.pp-chg{display:inline-block;font-size:10px;background:#fde8e8;color:#c62828;border-radius:6px;padding:0 5px}
.pp-row{display:flex;justify-content:space-between;font-size:14px;color:#333}.pp-row.note{font-size:12px;color:#777}
.pp-total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0}.pp-total span{font-weight:800;font-size:16px}.pp-total b{font-family:"Baloo 2",sans-serif;font-size:32px}
.pp-stamp{margin:8px auto 2px;width:max-content;max-width:100%;border:2.5px solid #1f8a4c;color:#1f8a4c;font-weight:800;border-radius:8px;padding:3px 10px;transform:rotate(-3deg);font-size:14px}.pp-stamp.red{border-color:#c62828;color:#c62828}
.pp-qr{display:grid;justify-items:center;gap:2px;margin-top:8px}.pp-qr b{font-size:15px}.pp-qr span{font-size:11px;color:#666}.pp-qr>div{background:#fff;padding:6px}
.pp-thanks{text-align:center;font-weight:800;font-size:15px}
.pp-tag{margin:6px 0 4px;text-align:center;font-weight:800;font-size:15px;border-radius:8px;padding:5px 8px;letter-spacing:.3px}
.pp-tag.vip{background:linear-gradient(90deg,#b8860b,#f5c542,#b8860b);color:#1c1300;box-shadow:0 1px 0 #8a6508 inset}
.pp-tag.ud{border:2px solid #d64545;color:#b42d2d}.pp-tag.inst{border:2px solid #2f6fdb;color:#2457b5}
.pp-en{font-size:10.5px;color:#666;font-weight:500}
.card .nm .en{display:block;font-family:var(--f-body,inherit);font-size:10.5px;font-weight:600;opacity:.62;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.pp-nut{margin:8px 0;border:1.5px solid #9bd3ad;border-radius:12px;padding:9px 9px 7px;background:linear-gradient(180deg,#f2fbf4,#fff)}
.pn-h{text-align:center;font-weight:800;color:#1f6b3c;font-size:14.5px;margin-bottom:6px}.pn-h small{font-weight:500;color:#5d7a66;font-size:11px}
.pn-g{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.pn-g>div{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #e1efe5;border-radius:8px;padding:4px 7px;font-size:12px;color:#333}
.pn-g>div:last-child:nth-child(odd){grid-column:1/-1;justify-content:center}
.pn-g i{font-style:normal}.pn-g span{flex:1}.pn-g b{color:#111;font-size:12.5px}
.pn-x{margin:7px 0 4px;text-align:center;font-weight:800;font-size:13px;color:#7a4b00;background:#fff4d6;border-radius:8px;padding:5px}
.pn-top{font-size:11.5px;color:#333;display:grid;gap:2px}.pn-top b{color:#1f6b3c}
.pn-c{text-align:center;font-weight:800;color:#c2410c;font-size:12.5px;margin-top:5px}
.pn-n{text-align:center;font-size:10px;color:#888;margin-top:5px}
.pp-order{margin:8px 0;border:2px solid #1f8a4c;border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:1px;background:#f1faf3}
.pp-order b{color:#1f6b3c;font-size:14px}.pp-order span{font-size:12px;color:#444}.pp-order big{font-size:22px;font-weight:800;letter-spacing:1px;color:#111}
.pp-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.pp-actions:has(> :nth-child(2):last-child){grid-template-columns:1fr 1fr}
.pp-actions button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 4px;font-size:22px;display:grid;justify-items:center;gap:2px}.pp-actions span{font-size:13px;font-weight:800}
.settle-sum{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}.settle-sum b{font-size:24px}
.creq{margin-top:12px;border:1.5px dashed var(--chili);border-radius:12px;padding:8px 12px}.creq summary{font-weight:800;color:var(--chili);cursor:pointer}
.creq-row{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.creq-row>div:first-child{display:grid;gap:2px}
/* v22 रूट, ग्राहक, बिल भेजना, नया सामान */
.locbar{display:block;width:100%;border:0;background:#fff4e5;color:#92400e;border:1.5px solid #f59e0b;font-weight:800;font-size:14px;line-height:1.3;padding:9px 12px;text-align:center;border-radius:12px;margin-bottom:8px}
.morning{display:grid;gap:2px;background:linear-gradient(135deg,#fff7e6,var(--surface));border:1.5px solid #fbbf24;border-radius:16px;padding:10px 14px;margin:0 0 12px;color:var(--ink)}.morning span{font-size:14px}.morning small{color:var(--muted);font-size:12px}
.nrev{border:2px solid #f59e0b}.nrev.ok{border-color:var(--leaf)}
#shbox{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}#shbox[hidden]{display:none}
.shb-scrim{position:absolute;inset:0;background:rgba(5,15,9,.55)}
.shb{position:relative;width:100%;max-width:520px;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
.shb h3{margin:0 0 2px;font-size:20px}
.card.addnew{border:2px dashed var(--leaf);background:transparent}.card.addnew .tile{display:flex;align-items:center;justify-content:center;background:var(--bg)}.card.addnew .em{font-size:30px}
.ragg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}.ragg .big{padding:10px 4px}
.rmap{position:relative;z-index:0;isolation:isolate;height:330px;border-radius:16px;overflow:hidden;margin:0 0 12px;background:var(--bg);box-shadow:var(--shadow)}
.rlive .livep{display:flex;align-items:center;gap:10px;padding:6px 0}.rlive .mid{flex:1;display:grid}
.rdv .rdv-k{display:flex;gap:14px;font-weight:900;margin:2px 0 6px}.rdv-r{border-top:1px solid var(--line);padding:8px 0}.rdv-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rdv-r .note{margin:2px 0 0}.rlive .mid span{font-size:13px;color:var(--muted)}
.rstop{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rs-t{display:grid;text-align:center;background:var(--bg);border-radius:10px;padding:4px}.rs-t b{font-size:14px}.rs-t span{font-size:11px;color:var(--muted)}
.rs-m{display:grid;min-width:0}.rs-m b{font-size:15px}
.rins{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}.rins.good{background:#e7f6ec;color:#14532d}.rins.bad{background:#fff3e0;color:#7c2d12}
.rtable{overflow-x:auto;margin-top:8px}.rtable table{width:100%;border-collapse:collapse;font-size:13px}.rtable th{font-size:11px;color:var(--muted);text-align:left;padding:4px}.rtable td{padding:6px 4px;border-top:1px solid var(--line)}.rtable .r{text-align:right;white-space:nowrap}
.audcard{border:2px solid #7c3aed;background:linear-gradient(135deg,rgba(124,58,237,.08),transparent)}
/* v23 खरीद */
.supcard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(124,58,237,.10),var(--surface));border:1.5px solid rgba(124,58,237,.35);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.supcard .mid{flex:1;display:grid;min-width:0}.supcard b{font-size:18px}.supcard .mid span{font-size:13px;color:var(--muted)}
.supav{width:42px;height:42px;border-radius:12px;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.supopt{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;text-align:left}
.supopt .mid{flex:1;display:grid}.supopt .mid span{font-size:12.5px;color:var(--muted)}
.nsbox summary{font-weight:800;color:var(--leaf);padding:6px 0;cursor:pointer}
.big-in{font-size:22px!important;font-weight:800;text-align:center}

/* v10 iOS-style skin: glass header, grouped surfaces, segmented control, floating capsule */
:root{--bg:#f2f2f7;--surface:#ffffff;--ink:#1c1c1e;--muted:#6c6c70;--line:#e3e3e8;--leaf:#1f7a4d;--leaf-ink:#ffffff;--haldi:#ffcc00;--haldi-ink:#2a1d00;--chili:#d70015;--chili-bg:#ffe9eb;--sky:#0064d2;--sky-bg:#e6f0fd;--ok-bg:#e4f6ea;--r:20px;--shadow:0 1px 1px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);--glass:rgba(242,242,247,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989f;--line:#323236;--leaf:#30d158;--leaf-ink:#00180a;--haldi:#ffd60a;--haldi-ink:#231a00;--chili:#ff6961;--chili-bg:#3a1513;--sky:#64a8ff;--sky-bg:#10233d;--ok-bg:#0f2e1a;--shadow:0 1px 1px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);--glass:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989f;--line:#323236;--leaf:#30d158;--leaf-ink:#00180a;--haldi:#ffd60a;--haldi-ink:#231a00;--chili:#ff6961;--chili-bg:#3a1513;--sky:#64a8ff;--sky-bg:#10233d;--ok-bg:#0f2e1a;--shadow:0 1px 1px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);--glass:rgba(0,0,0,.6);color-scheme:dark}
body{-webkit-font-smoothing:antialiased}
header{background:color-mix(in srgb,var(--leaf) 90%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.modes{display:flex;gap:2px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));padding:3px;border-radius:12px;width:max-content;max-width:100%}
.modes .chip{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:700;color:var(--ink)}
.modes .chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.modes .chip.ud[aria-pressed="true"]{color:var(--chili);background:var(--surface)}
.modes .chip.inst[aria-pressed="true"]{color:var(--sky);background:var(--surface)}
.cats .chip{border:0;background:var(--surface);box-shadow:var(--shadow)}
.cats .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid .card{border-radius:18px;box-shadow:var(--shadow)}
.cartbar{background:none}
.cartbtn{border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sheet{border-radius:28px 28px 0 0}
.qpop{border-radius:22px}
.big{border-radius:14px}
.kpi,.list,.tblwrap,.card2{border-radius:18px}
/* net status */
.netbar{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;font-weight:700;border-radius:12px;padding:6px 10px;margin-bottom:8px}
.netbar.off{background:var(--chili-bg);color:var(--chili)}.netbar.sync{background:var(--sky-bg);color:var(--sky)}.netbar.ok{background:var(--ok-bg);color:var(--leaf)}
/* live */
.live{display:grid;gap:8px;margin-bottom:14px}
.livep{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.livep .dot{width:10px;height:10px;border-radius:99px;flex:none;background:var(--muted)}
.livep .dot.on{background:#34c759;box-shadow:0 0 0 4px color-mix(in srgb,#34c759 25%,transparent)}
.livep .mid{flex:1;min-width:0}.livep .mid b{display:block}.livep .mid span{font-size:12px;color:var(--muted)}
.livep .rt{text-align:right;font-weight:800}.livep .rt small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mine{background:var(--surface);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;font-weight:700}
/* lock screen */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
#lock h2{margin:0;font-family:var(--f-display);font-size:26px}
#lock .who2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
#lock .who2 button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 18px;font-weight:800;font-size:17px}
#lock .who2 button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink)}
.dots{display:flex;gap:16px;justify-content:center;height:16px}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.bad{animation:shake .35s}

#bts .btab small{font-size:13px}#bts .btab .bx{width:18px;height:18px;font-size:12px}
#bts .btab.new{flex:0 0 auto;padding:3px 10px;font-size:18px}
/* ग्राहक पट्टी: दो बराबर साफ़ खाने, फोकस पर सिर्फ़ नारंगी किनारा */
.bcust:not(.pill){flex:1 1 100%!important;display:grid!important;grid-template-columns:1fr 1fr;gap:8px;background:transparent!important;box-shadow:none!important;padding:0!important;border-radius:0}
.bcust:not(.pill) label{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px!important;border-radius:11px!important;background:rgba(255,255,255,.08)!important;border:1.5px solid rgba(255,255,255,.16)!important;flex:none!important}
.bcust:not(.pill) label+label{border-left:1.5px solid rgba(255,255,255,.16)!important}
.bcust:not(.pill) label:focus-within{background:rgba(255,255,255,.12)!important;border-color:var(--haldi)!important}
.bcust:not(.pill) input{color:#fff!important;font-size:14px;font-weight:700;padding:0!important}
.bcust:not(.pill) input::placeholder{color:rgba(255,255,255,.55)!important;font-weight:600}
.bcust:not(.pill) .ic{font-size:14px;opacity:.9}
.bcust.pill{flex:1 1 100%!important;border-radius:11px}
/* बिलिंग स्क्रीन पर "शुभ रात्रि / आज के बिल" वाली पट्टी नहीं — जगह सामान के लिए */
#greet{display:none!important}

/* ===== v10 काउंटर: टैप से जोड़ो, उठा हुआ कार्ड, स्टेपर, छोटा वज़न पॉपअप, अपने-आप टाइल आर्ट ===== */
.tile.art{background:
  radial-gradient(circle at 18% 22%,rgba(255,255,255,.28) 0 2px,transparent 2.6px) 0 0/16px 16px,
  radial-gradient(120% 90% at 50% 18%,hsl(var(--h) 78% 66%),hsl(var(--h) 70% 44%) 62%,hsl(calc(var(--h) + 24) 72% 30%))}
.tile.art::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.32),transparent 42%);pointer-events:none}
.tile.art .em{position:relative;z-index:1;transform:translateY(-6px)}
.tile .tbr{display:none}
.grid .tile.art .tbr{display:block;position:absolute;left:6px;right:6px;bottom:6px;z-index:2;font-family:var(--f-display);font-weight:800;font-size:12.5px;line-height:1.15;letter-spacing:.3px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;border-radius:8px;background:rgba(0,0,0,.24);backdrop-filter:blur(2px);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.grid .tile.art.hasimg .tbr,.grid.rows .tile .tbr{display:none}
.grid.rows .tile.art .em{transform:none}
.grid .card{transition:transform .22s cubic-bezier(.3,1.5,.5,1),box-shadow .22s ease}
.grid .card.in{transform:translateY(-5px) scale(1.025);box-shadow:0 12px 24px -8px rgba(22,120,60,.55),0 0 0 2.5px var(--leaf);z-index:1}
.grid .card.in:active{transform:translateY(-3px) scale(.99)}
.qbub{position:absolute;top:6px;right:6px;z-index:3;min-width:26px;height:26px;padding:0 7px;border-radius:99px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;background:var(--leaf);box-shadow:0 3px 8px rgba(0,0,0,.28);animation:qb .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes qb{from{transform:scale(.3)}to{transform:scale(1)}}
.grid.rows .qbub{position:static;order:-1;margin-left:6px}
.card .addb{background:linear-gradient(#fff,#f3fbf5)}
.card .cstep{height:38px;border-radius:12px;background:var(--leaf);box-shadow:0 4px 10px -4px rgba(22,120,60,.7)}
.card .cstep button{width:42px;height:38px;font-size:22px}
.card .cstep button:active{background:rgba(255,255,255,.22)}
.card .cstep b{flex:1;height:30px;line-height:30px;margin:0 2px;border-radius:8px;background:rgba(255,255,255,.18);font-size:16px}
.qinl{flex:1;min-width:0;width:40px;height:30px;margin:4px 2px;border:0;border-radius:8px;text-align:center;font-weight:900;font-size:17px;color:var(--ink);background:#fff;outline:3px solid var(--haldi)}
@media (prefers-reduced-motion:reduce){.grid .card.in{transform:none}.qbub{animation:none}}
/* छोटा वज़न पॉपअप — काम रुके नहीं */
.qpop{max-width:400px;padding:10px 10px 12px;gap:8px;border-radius:18px}
.qpop .qh{gap:8px}.qpop .qh .tile{width:38px;border-radius:10px}.qpop .qh .tile .em{font-size:20px;transform:none}
.qpop .qn b{font-size:16px}.qpop .qn span{font-size:12.5px}
.qpop .x{width:34px;height:34px;font-size:15px}
.qpop .qf{border-radius:12px;padding:0 10px}.qpop .qf input{font-size:21px;padding:4px 0}.qpop .qf span{font-size:13px}
.qchips2.one{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.qchips2.one::-webkit-scrollbar{display:none}
.qchips2.one button{flex:1 1 0;min-width:40px;padding:8px 2px;font-size:13.5px;border-radius:10px;white-space:nowrap}
.qchips2.one button.rp{border-color:var(--haldi);background:#fff8e6}
.qpop .big{padding:10px;font-size:15px;border-radius:12px}

/* 🔄 अपडेट बटन */
.updbox .big.upd{background:linear-gradient(120deg,var(--leaf),var(--hdr3,#4f46e5));color:#fff;font-weight:800}
.updbox .big.upd:disabled{opacity:.6}
.updbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.updbar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .25s}

/* 🎪 मेला */
.chip.melac{background:linear-gradient(120deg,#f97316,#db2777);color:#fff;border-color:transparent;font-weight:800}.chip.melac[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(249,115,22,.4)}
.tokbox{margin:4px 0 10px;padding:10px;border-radius:16px;background:linear-gradient(135deg,#fff7ed,#ffe4e6);border:1.5px dashed #fb923c}
.tokh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.tokh b{flex:1;font-size:17px;color:#9a3412}.tokh .big{width:auto;padding:8px 14px;font-size:14px;margin:0}
.tokg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tok{display:grid;justify-items:center;padding:8px 4px;border-radius:12px;background:#fff;border:1.5px solid #fdba74;text-align:center}.tok i{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:22px;color:#c2410c;line-height:1}.tok b{font-size:13px;color:#111;line-height:1.15;margin-top:3px}.tok span{font-size:11px;color:#9a3412}

/* v11 छोटे कार्ड — एक स्क्रीन में ज़्यादा सामान: टाइल पर टैप = जोड़ें, "+ जोड़ें" पट्टी की जगह कोने में + */
.grid{gap:7px}
.grid .tile{aspect-ratio:16/10}
.grid .tile .em{font-size:28px}
.grid .tile.art .em{transform:translateY(-5px)}
.grid .tile.art .tbr{font-size:11px;bottom:4px;left:4px;right:4px;padding:1px 5px}
.grid .card .nm{font-size:13.5px;padding:4px 7px 0}
.grid .card .sz{font-size:10.5px;padding:0 7px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .card .pr{padding:0 7px 5px}
.card .addb{display:none}
.grid .card:not(.in):not(.off) .tile::before{content:"+";position:absolute;right:5px;bottom:5px;z-index:3;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font:900 18px/1 var(--f-display);color:#fff;background:var(--leaf);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.grid .tile.art .tbr{right:32px}
.grid .card .cstep{height:32px;margin:2px 5px 5px;border-radius:10px}.grid .card .cstep button{height:32px;width:34px;font-size:19px}.grid .card .cstep b{height:26px;line-height:26px;font-size:15px}
.grid .card .stk,.grid .card .xp{font-size:9.5px;padding:1px 5px}
.grid.rows .card:not(.in) .tile::before{display:none}

/* 🎪 मेला: बड़ा साफ़ नाम, छोटी फोटो, तीन हिस्से */
.mgh{grid-column:1/-1;margin:4px 2px -2px;font-family:var(--f-display);font-weight:900;font-size:15px;color:#f97316;display:flex;align-items:center;gap:6px}
.mgh::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#f97316,transparent)}
.grid.mela .tile{aspect-ratio:2/1}.grid.mela .tile .em{font-size:26px;transform:none!important}
.grid.mela .tile .tbr,.grid.mela .card .sz,.grid.mela .card .mg,.grid.mela .card .stk{display:none!important}
.grid.mela .card .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.15;padding:5px 7px 1px;min-height:2.3em}
.grid.mela .card .nm .en{display:none}
.grid.mela .card .pr{padding:0 7px 5px}.grid.mela .card .pr b{font-size:16px;color:#ea580c}

/* ⚡ एक टैप बिल (31-10-2026) */
.paym.ck-chips{grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.paym.ck-chips.one{grid-template-columns:1fr}
.paym.ck-chips button{padding:9px 2px;font-size:14px;border-radius:12px;line-height:1.15}
.paym.ck-chips button[aria-pressed="true"]{border-color:var(--leaf);background:var(--ok-bg);box-shadow:0 0 0 2px var(--leaf) inset}
.ck-mini{display:flex;align-items:center;gap:8px;margin:0 0 8px}.ck-mini .inp{flex:1;padding:9px 12px;font-size:16px}.ck-mini b{white-space:nowrap;font-size:15px}
.ck-who{margin:-2px 0 8px;font-weight:700}
.ck-foot{display:grid;grid-template-columns:1fr 2.3fr;gap:8px;margin-top:2px}
.ck-foot .big{margin:0;padding:14px 8px}
.ck-foot [data-hold]{display:grid;justify-items:center;gap:0;font-size:20px;line-height:1.1;padding:8px 4px}.ck-foot [data-hold] span{font-size:12.5px;font-weight:800}
.ck-foot [data-save]{font-size:18px}

/* 🧩 कसे हुए कार्ड (31-10-2026): आधी ऊँचाई की टाइल, कंपनी बड़ी, इमोजी छोटा कोने में, नाम साफ़ */
.grid .tile{aspect-ratio:2.3/1}
.grid .tile.art .em{position:absolute;left:5px;top:auto;bottom:3px;font-size:16px;transform:none;filter:none;opacity:.95}
.grid .tile.art .tbr{display:block;position:absolute;inset:0 30px 0 22px;bottom:auto;top:50%;transform:translateY(-50%);font-size:14.5px;letter-spacing:.2px;white-space:normal;line-height:1.05;max-height:2.2em;overflow:hidden;background:none;backdrop-filter:none;padding:0;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.grid .tile.hasimg{background:#fff}.grid .tile.hasimg img{object-fit:contain}
.grid .card .nm{white-space:normal;text-overflow:clip;font-size:14px;font-weight:800;line-height:1.15;padding:3px 6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid .card:not(.in):not(.off) .tile::before{width:21px;height:21px;font-size:16px;right:4px;bottom:4px}
.grid.mela .tile{aspect-ratio:2.3/1}
#camZoom{font-weight:800}

/* 🟩 वेज / 🟫 नॉन-वेज निशान, ❄️ ठंडा रखें */
.tile .vegm{position:absolute;left:5px;bottom:5px;z-index:3;width:14px;height:14px;border:2px solid #16a34a;border-radius:3px;background:#fff;display:grid;place-items:center}
.tile .vegm::after{content:"";width:6px;height:6px;border-radius:99px;background:#16a34a}
.tile .vegm.nonveg,.tile .vegm.egg{border-color:#92400e}.tile .vegm.nonveg::after,.tile .vegm.egg::after{background:#92400e;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tile .stor{position:absolute;left:22px;bottom:3px;z-index:3;font-style:normal;font-size:13px}
.grid.rows .tile .vegm{width:11px;height:11px;left:2px;bottom:2px}
/* 📷 कैमरा बीच में (हेडर के नीचे) */

.cambtns{top:auto;bottom:8px}
@media (min-width:900px){html.camon{--camh:24vh}#camwin .cfr{left:30%;right:30%;top:16%;bottom:22%}}

html.camon #greet,html.camon #demo{display:none!important}
/* 🎨 सब्ज़ी एक्सप्रेस वाला iPhone Pro रंग-रूप (गहरा नीला ऊपर, नारंगी मुख्य बटन, हरा सिर्फ़ मुनाफ़ा/ठीक) */
:root{--bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f5;--ink:#1c1c1e;--muted:#6e6e73;--line:#e3e3e8;
 --accent:#ef5a0a;--accent-2:#ff8a3d;--accent-ink:#ffffff;--accent-bg:#fff1e6;--grad:linear-gradient(135deg,#ff9a4d 0%,#f2640f 55%,#e04a00 100%);
 --hdr:linear-gradient(135deg,#0d1a33 0%,#1b3566 100%);--hdr-solid:#13264a;--hdr-ink:#ffffff;
 --leaf:#1f8a3c;--leaf-ink:#ffffff;--ok-bg:#e8f7ec;--sky:#0a6cff;--sky-bg:#e8f1ff;
 --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1c1c1e;--surface2:#2c2c2e;--ink:#f5f5f7;--muted:#9a9aa1;--line:#38383a;
 --accent:#ff8a3d;--accent-2:#ffb067;--accent-ink:#ffffff;--accent-bg:#3a2112;--grad:linear-gradient(135deg,#ff9a52 0%,#f06418 55%,#d94c06 100%);
 --hdr:linear-gradient(135deg,#070d1a 0%,#13264a 100%);--hdr-solid:#0b1630;--hdr-ink:#ffffff;
 --leaf:#30d158;--leaf-ink:#00180a;--ok-bg:#0f2e1a;--sky:#64a8ff;--sky-bg:#10233d;--shadow:0 1px 1px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55)}}
html body::before{background:var(--hdr-solid)}
html header{background:var(--hdr);color:var(--hdr-ink);box-shadow:0 6px 20px rgba(8,16,40,.25);-webkit-backdrop-filter:none;backdrop-filter:none}
html .tabs button{color:var(--hdr-ink);opacity:.72;border-bottom:0;border-radius:99px;margin:0 1px 6px;padding:6px 11px}
html .tabs button[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff}

html header{--leaf-ink:#ffffff}html #sbar .scanbtn{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}html .btab[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}html .btab[aria-pressed="true"] *{color:#fff}

html .big{background:var(--grad);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);text-shadow:0 1px 1px rgba(0,0,0,.15)}
html .big.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);text-shadow:none;border:1px solid var(--line)}

html .bars div,html .hbar .t i{background:linear-gradient(180deg,var(--accent-2),var(--accent))}

/* ⚡ हल्का-तेज़: स्क्रीन से बाहर के कार्ड ब्राउज़र नहीं बनाता (500+ सामान पर भी स्मूद) */
.grid .card{content-visibility:auto;contain-intrinsic-size:auto 230px}
.grid.rows .card{contain-intrinsic-size:auto 64px}
/* 🍱 फोटो वाली टाइल — सब्ज़ी एक्सप्रेस जैसी: पूरी चौड़ाई की फोटो, नीचे बड़ा नाम */
.grid .tile.hasimg.food{background:#2a1a12}
.grid .tile.hasimg.food img{object-fit:cover;padding:0}
.grid .card .tile.hasimg.food{aspect-ratio:4/3}
.grid .tile.hasimg .em{display:none}

/* ⚖️ तौल पॉपअप — डार्क में भी साफ़ */
.qchips2 button,.qchips button{color:var(--ink)}
.qchips2.one button.rp{background:var(--accent-bg,#fff1e6);color:var(--ink);border-color:var(--accent,#ef5a0a)}
.qf input{color:var(--ink);caret-color:var(--accent,#ef5a0a)}
.qf input::placeholder{color:var(--muted);opacity:.6}
.qpop{background:var(--surface);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45)}

/* भैरव ऐप से आए नए डिब्बों के रंग */

const UD_LIMIT=2000;

function codes(it){return String(it.barcode||"").split(/[,\s]+/).filter(Boolean)}
function findByCode(c){const V=window.SE&&SE.codeVariants?SE.codeVariants(c):[String(c||"").trim()];for(const v of V){const it=S.items.find(i=>codes(i).includes(v));if(it)return it}const v0=V[0];return S.items.find(i=>i.code&&String(i.code)===v0)}
function beep(ok){camFlash(ok);try{if(navigator.vibrate)navigator.vibrate(ok?35:[60,40,60])}catch(e){}try{const A=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.frequency.value=ok?1250:330;g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+(ok?.09:.25))}catch(e){}}
async function adjStock(pairs,why){
  /* 📦→🔹 पैकेट वाला सामान (packOf) का स्टॉक उसके पीस वाले सामान में गिना जाता है: 1 पैकेट = perPack पीस */
  pairs=pairs.map(([id,d])=>{const it=item(id);return it&&it.packOf&&+it.perPack>0&&item(it.packOf)?[it.packOf,r2(d*it.perPack)]:[id,d]}).filter(p=>p[1]);
  for(const [id,d] of pairs){
    const cur=+(S.pstock[id]?.qty)||0;S.pstock[id]={...(S.pstock[id]||{}),qty:r2(cur+d),ts:Date.now()};
    if(!S.demo){try{await S.db.collection("pstock").doc(id).set({qty:SE.inc(r2(d)),ts:Date.now(),by:S.uid||"",byName:biller(),last:why||""},{merge:true});S.db.collection("stockLog").doc("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({itemId:id,d:r2(d),why:why||"",ts:Date.now(),date:today(),by:S.uid||"",byName:biller()}).catch(()=>{})}catch(e){toast("स्टॉक अपडेट नहीं हुआ")}}
  }
}
function packMap(id,q){const it=item(id);return it&&it.packOf&&+it.perPack>0&&item(it.packOf)?[it.packOf,r2(q*it.perPack)]:[id,q]}
function trackedPairs(lines,sign){return lines.filter(l=>{const it=item(l.id);return it&&(it.track||(it.packOf&&item(it.packOf)?.track))}).map(l=>packMap(l.id,sign*l.qty))}
async function handleScan(code){
  code=window.SE&&SE.normCode?SE.normCode(code):String(code||"").trim();if(!code)return;
  if(window.SA&&SA.scan(code))return;/* 🔢 बिल का बारकोड (BW-…) = वही बिल + वापसी */
  if(window.SRX&&SRX.scan(code))return;/* 📍 रैक बदलें शीट खुली: स्कैन = सामान / खाना */
  if(window.SRK&&SRK.scan(code))return;/* 📍 रैक लगाओ: स्कैन = यह सामान इस खाने का */
  if(window.SBC&&SBC.scan(code))return;/* 🏷️ बारकोड पहरा: "लग गया" की जाँच या पैकेट का बारकोड जोड़ना */
  if(window.SL&&SL.scan(code))return;/* 🏷️ लेबल टैब या बिलिंग का बारकोड-मोड: स्कैन = लेबल की लिस्ट में +1 */
  if(S.tab==="kharid"&&window.SI&&SI.active()&&SI.scan(code))return;
  if(window.SO&&SO.active()){const it=findByCode(code);beep(!!it);if(!it){unknownCode(code);return}SO.scan(it);return}
  if(S.tab==="mkt"&&window.SM&&SM.scan(code))return;
  const vw=window.SF&&!S.scanIn&&!findByCode(code)?SF.parseVW(code):null;
  if(vw){if(vw.bad){beep(false);toast("लेबल का सामान (कोड "+vw.plu+") लिस्ट में नहीं");return}
    if(S.tab!=="bill"){S.tab="bill";showTab()}if(vw.it.active===false){toast(vw.it.name+" अभी बंद है");return}if(!(priceOf(vw.it)>0)){toast(vw.it.name+" का रेट नहीं डाला गया");return}
    if(vw.kind==="fix"&&vw.it.unit!=="pc"){beep(true);openQty(vw.it);return}quickAdd(vw.it,vw.qty);return}
  const it=findByCode(code);beep(!!it);
  if(!it){unknownCode(code);return}
  if(window.SBC)SBC.seen(it,code);/* दुकान वाला लेबल स्कैन हुआ = लेबल लगा है → अपने-आप ✅ */
  if(S.tab==="stock"&&window.SK&&SK.counting()){SK.scanCount(it);return}
  if(S.tab==="kharid"&&!S.scanIn&&window.SF&&SF.scanAdd){SF.scanAdd(it);return}
  if(S.scanIn){
    await adjStock([[it.id,1]],"माल आया");
    if(!S.demo){try{await S.db.collection("inward").doc("w"+Date.now().toString(36)+Math.random().toString(36).slice(2,4)).set({itemId:it.id,name:it.name,qty:1,cost:(window.SF?SF.costOf(it):(+it.cost||0)),code,date:today(),ts:Date.now(),by:S.uid||"",byName:biller()})}catch(e){}}
    toast("📦 "+it.name+" +1 · अब स्टॉक "+fq(S.pstock[it.id].qty,it.unit));if(S.tab==="day")renderDay();return}
  if(S.tab!=="bill"){S.tab="bill";showTab()}
  if(it.active===false){toast(it.name+" अभी बंद है");return}
  const p=priceOf(it);if(!(p>0)){toast(it.name+" का रेट नहीं डाला गया");return}
  if(!isPc(it.unit)){openQty(it);return}
  if(!canSell(it))return;
  const ex=S.cart.find(l=>l.id===it.id&&!l.changed&&!l.free);
  if(ex){ex.qty=r2(ex.qty+1);ex.amt=r2(ex.qty*ex.rate);ex.sc=(ex.sc||0)+1}
  else S.cart.push({key:Math.random().toString(36).slice(2),id:it.id,name:billNm(it),realName:it.name,emoji:it.emoji,unit:it.unit,qty:1,rate:p,board:p,cost:(window.SF?SF.costOf(it):(+it.cost||0)),changed:false,free:false,amt:p,sc:1});
  clearSearch();refreshAfterCart();popItem(it.id);
  const inCart=S.cart.filter(l=>l.id===it.id).reduce((a,l)=>a+l.qty,0),left=it.track?r2((+(S.pstock[it.id]?.qty)||0)-inCart):null;
  toast("✓ "+it.name+" · "+rs(p)+(inCart>1?" · कुल "+inCart:"")+(left!=null&&left<0?" · ⚠ स्टॉक में इतना नहीं दिखता":""));
}

/* ✂️ स्थायी नियम: बिल व लेबल पर छोटा नाम (24 अक्षर तक) — "कंपनी + सामान + साइज़"। it.short हो तो वही, नहीं तो अपने-आप छोटा */
const SHORT_MAX=24;
const SH_AB=[[/\bMasala\b/gi,"Msl"],[/\bBiscuits?\b/gi,"Bisc"],[/\bChocolate\b/gi,"Choc"],[/\bPowder\b/gi,"Pwd"],[/\bPacket\b/gi,"Pkt"],[/\bCream\b/gi,"Crm"],[/\bSpecial\b/gi,"Spl"],[/\bPremium\b/gi,"Prm"],[/\bOriginal\b/gi,"Orig"],[/\bFlavou?r(ed)?\b/gi,"Flv"],[/\bChicken\b/gi,"Chkn"],[/\bPaneer\b/gi,"Pnr"],[/\bTandoori\b/gi,"Tndr"],[/\bButter\b/gi,"Btr"],[/\bVegetable\b/gi,"Veg"],[/\bDetergent\b/gi,"Det"],[/\bShampoo\b/gi,"Shmp"],[/\bToothpaste\b/gi,"T.Paste"],[/\bChips\b/gi,"Chps"],[/\bNamkeen\b/gi,"Nmkn"],[/\bCookies\b/gi,"Cooki"],[/\bJuice\b/gi,"Jc"],[/\bBottle\b/gi,"Btl"]];
const SH_DROP=/^(shahi|super|new|fresh|pure|classic|delicious|tasty|best|the|and|with|mix(ed)?)$/i;
function autoShort(n){let s=String(n||"").replace(/\s+/g," ").trim()
  .replace(/(\d)\s*(g|gms?|grams?|gm)\b/gi,"$1g").replace(/(\d)\s*kgs?\b/gi,"$1kg").replace(/(\d)\s*ml\b/gi,"$1ml").replace(/(\d)\s*(ltrs?|litres?|liters?)\b/gi,"$1L");
  if(s.length<=SHORT_MAX)return s;
  s=s.replace(/\s*\(([^)]*)\)/g,(m,x)=>/\d/.test(x)?" "+x.replace(/\s+/g,"").replace(/पीस|pcs?/i,"pc"):"").trim();
  s=s.replace(/\s+(namkeen|snacks?)\b/gi,"");
  for(const [r,v] of SH_AB){if(s.length<=SHORT_MAX)break;s=s.replace(r,v)}
  if(s.length>SHORT_MAX){const w=s.split(" ");for(let i=w.length-2;i>0&&w.join(" ").length>SHORT_MAX;i--)if(SH_DROP.test(w[i]))w.splice(i,1);s=w.join(" ")}
  if(s.length>SHORT_MAX){const m=s.match(/\s(\S*\d\S*)$/),tail=m?" "+m[1]:"";s=s.slice(0,SHORT_MAX-tail.length).trim()+tail}
  return s}
function shortNm(it){return it?SE.capNm(it.short?String(it.short).slice(0,30):autoShort(it.name)):""}/* 🔠 बिल/लेबल पर हमेशा CAPITAL */

function isTob(it){return !!it&&(it.sub==="tob"||!!it.secret||TOBRX.test([it.name,it.hi,it.alias].join(" ")))}
function billNm(it){return !it?"":it.secret?"Misc Item "+it.secret:isTob(it)?"Misc Item #"+(it.code||String(it.id).slice(-4)):shortNm(it)}

function nbHits(q){q=String(q||"").trim().toLowerCase();const own=c=>/^2[01]\d{11}$/.test(c);
  const noCo=i=>!codes(i).some(c=>/^\d{8,14}$/.test(c)&&!own(c));
  const pr=i=>{const x=window.SL&&SL.doneOf?SL.doneOf(i):null;return x?x.ts||1:0};
  let L=S.items.filter(i=>!i.virtual&&i.active!==false&&isPc(i.unit));
  L=q?L.filter(i=>((i.name||"")+" "+(i.short||"")+" "+(i.hi||"")+" "+(i.alias||"")).toLowerCase().includes(q)||String(i.code||"")===q):L.filter(i=>noCo(i)&&pr(i));
  L.sort((a,b)=>(noCo(b)-noCo(a))||(pr(b)-pr(a)));
  return L.slice(0,8).map(i=>`<button type="button" class="nb-hit" data-nbpick="${esc(i.id)}">${tileHTML(i)}<span><b>${esc(SE.capNm(i.short||i.name))}</b><small>${i.code?"#"+esc(i.code):""}${rkOf(i)?" · 📍"+esc(rkOf(i)):""}${noCo(i)?" · 🏷️ दुकान का लेबल":" · कंपनी बारकोड है"}</small></span><em>🔗 जोड़ें</em></button>`).join("")||`<p class="note" style="margin:4px 0">${q?"नहीं मिला":"नाम लिखकर खोजें"}</p>`}

async function decodeImage(file){
  if("BarcodeDetector" in window){try{const bd=new BarcodeDetector();const bmp=await createImageBitmap(file);const r=await bd.detect(bmp);if(r.length)return r[0].rawValue}catch(e){}}

  const url=URL.createObjectURL(file);
  try{const rd=new ZXing.BrowserMultiFormatReader();const res=await rd.decodeFromImageUrl(url);return res.getText()}finally{URL.revokeObjectURL(url)}
}

/* keyboard-wedge scanner: very fast keys ending in Enter */
const W={buf:"",t:0,gaps:[]};
document.addEventListener("keydown",e=>{
  const now=performance.now();
  if(e.key==="Enter"||(e.key==="Tab"&&W.buf.length>=6&&now-W.t<80)){
    const b=W.buf,avg=W.gaps.length?W.gaps.reduce((a,x)=>a+x,0)/W.gaps.length:999;W.buf="";W.gaps=[];
    const inPop=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#sheet");
    if(b.length>=6&&avg<50&&(!inPop||/^\d{8,14}$/.test(b)&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches("#qIn,#aIn,#rtIn")))){e.preventDefault();e.stopImmediatePropagation();
      const ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&ae.value.endsWith(b)){ae.value=ae.value.slice(0,-b.length);if(ae.id==="q"){S.q=ae.value}}
      handleScan(b);return}
    if(e.target&&e.target.id==="q"){const v=e.target.value.trim();if(v&&findByCode(v)){e.preventDefault();e.target.value="";S.q="";handleScan(v)}else if(/^\d{6,}$/.test(v)){e.preventDefault();e.target.value="";S.q="";renderBill();handleScan(v)}}
    return}
  if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
  if(now-W.t>80){W.buf="";W.gaps=[]}else if(W.buf)W.gaps.push(now-W.t);
  W.buf+=e.key;W.t=now;
},true);

function hkey(x){let h=5381;for(const c of String(x))h=(h*33+c.codePointAt(0))>>>0;return "p"+h.toString(16)}
async function pinHash(name,pin){try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("se|"+name+"|"+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){return "x"+hkey(name+"|"+pin)}}

function pinGate(){

async function guardBills(date,bills){

  });

function cashCalc(d){
  const sale=liveBills().filter(b=>b.mode!=="inst");
  const cashSale=r2(sale.reduce((a,b)=>a+(b.pay.cash||0),0));
  const jamaCash=r2(S.ledger.filter(l=>l.date===d&&l.type==="jama"&&l.mode!=="upi"&&l.mode!=="return").reduce((a,l)=>a+l.amt,0));
  const khCash=r2(S.kharch.filter(k=>k.mode!=="upi").reduce((a,k)=>a+(+k.amt||0),0)+(window.SF?SF.gallaPaid():0));
  const khAll=r2(S.kharch.reduce((a,k)=>a+(+k.amt||0),0));
  const cl=S.close||{};const G=window.SG?SG.forCalc():null;
  const float=G&&G.float!=null?G.float:cl.float!=null&&cl.float!==""?+cl.float:(+S.settings.float||0);
  const out=G?G.out:0;
  const rvCash=window.SV?SV.cashAt(d,0,Infinity):0;/* ↩️ वापसी: नकद लौटाया (−) / मिला (+) */
  const expected=r2(float+cashSale+jamaCash-khCash-out+rvCash);
  const counted=G&&G.counted!=null?G.counted:cl.counted!=null&&cl.counted!==""?+cl.counted:null;
  return {cashSale,jamaCash,khCash,khAll,float,out,expected,counted,diff:counted==null?null:r2(counted-expected)};
}

function rangeHTML(){

}
async function loadRange(n){
  S.range={n,loading:true};$("#rangeBox").innerHTML=rangeHTML();
  const ds=[];for(let i=n-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);ds.push(today(x))}
  try{
    const snaps=S.demo?ds.map(d=>d===today()?S.dayBills:[]):await Promise.all(ds.map(d=>S.db.collection("days/"+d+"/bills").get().then(s=>s.docs.map(x=>x.data())).catch(()=>[])));
    const items={};const days=ds.map((d,i)=>{const bl=snaps[i].filter(b=>!b.cancelled&&b.mode!=="inst");let profit=0;
      bl.forEach(b=>{profit-=(b.disc||0);b.lines.forEach(l=>{const o=items[l.id]||(items[l.id]={name:l.name,unit:l.unit,qty:0,amt:0,p:0,np:false});o.qty+=l.qty;o.amt+=l.amt;if(l.cost>0){const m=(l.rate-l.cost)*l.qty;o.p+=m;profit+=m}else o.np=true})});
      return {d,sale:r2(bl.reduce((a,b)=>a+b.total,0)),profit:r2(profit),n:bl.length}});
    const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,12).map(o=>({...o,p:o.np&&!o.p?null:r2(o.p)}));
    S.range={n,days,top};
  }catch(e){S.range=null;toast("पुरानी बिक्री लोड नहीं हुई")}
  if(S.tab==="report")$("#rangeBox").innerHTML=rangeHTML();
}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1000,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},"image/jpeg",.86)};img.onerror=rej;img.src=u})}

/* 🔄 अपडेट बटन — कर्मचारी को बस इतना: "👤 नाम दबाओ → ऐप अपडेट करें" */
function updBoxHTML(){return `<div class="updbox"><button class="big upd" data-updnow>🔄 ऐप अपडेट करें</button><div class="updbar" hidden><i></i></div><p class="note updmsg" style="margin:6px 0 0;text-align:center">अभी: ${esc(SE.version)} · नया संस्करण GitHub से आता है, आपका कोई डेटा नहीं मिटता</p></div>`}
async function runUpdate(){const B=[...document.querySelectorAll("[data-updnow]")];if(B.some(b=>b.disabled))return;
  if(S.saving){toast("बिल सेव हो रहा है — एक पल रुकें");return}
  const say=(m,k,pc)=>{document.querySelectorAll(".updbox").forEach(x=>{const ms=x.querySelector(".updmsg"),bar=x.querySelector(".updbar"),bt=x.querySelector("[data-updnow]");if(ms){ms.textContent=m;ms.style.color=k==="bad"?"var(--chili)":k==="ok"?"var(--leaf)":""}if(bar){bar.hidden=pc==null;if(pc!=null)bar.firstElementChild.style.width=pc+"%"}if(bt)bt.disabled=!(k==="bad"||k==="ok")})};
  await SE.updateNow(say);if(S.isOwner&&!S.demo){autoNewData(true);if(window.SPK)SPK.apply()}}
/* मालिक का फ़ोन: नए संस्करण में आया नया सामान/खरीद (migrate.json) अपने-आप जोड़ो — सिर्फ़ जोड़ना, पहले वाला कभी नहीं बदलता/मिटता।
   कर्मचारियों के फ़ोन में वही सामान Firebase से तुरंत आ जाता है। */
/* नई रेट-लिस्ट वाला सामान पुराने को सिर्फ़ छिपाता है (active:false) — मिटता कुछ नहीं, पुराने बिल वैसे ही */
async function hideReplaced(col,id,d){if(col!=="items"||!d.replaces)return;try{const o=item(d.replaces);if(o&&o.active===false)return;const r=S.db.collection("items").doc(d.replaces);const g=await r.get();if(g.exists&&g.data().active!==false)await r.update({active:false,replacedBy:id})}catch(e){}}
/* 📝 _upd: Claude के भेजे सीमित बदलाव (जैसे भाव) — सिर्फ़ तब जब अभी का मान ठीक "from" हो (मालिक ने बीच में खुद बदला हो तो नहीं छूता), हर बदलाव priceLog में */
async function applyUpd(m){const U=m&&m._upd;if(!U)return 0;let n=0;
  for(const [col,docs] of Object.entries(U))for(const [id,f] of Object.entries(docs)){try{const ref=S.db.collection(col).doc(id);const g=await ref.get();if(!g.exists)continue;const cur=g.data()||{},p={};
    for(const [k,v] of Object.entries(f)){const now=cur[k]==null?null:cur[k];if(now===(v.from==null?null:v.from)&&String(now)!==String(v.to))p[k]=v.to}
    if(!Object.keys(p).length)continue;await ref.update(p);n++;if(col==="items"){const it=item(id);if(it)Object.assign(it,p);for(const k of ["sale","cost","mrp"])if(k in p&&typeof logPrice==="function")logPrice(id,k,cur[k]||0,p[k])}}catch(e){}}
  return n}
async function autoNewData(force){if(!S.isOwner||S.demo||!S.db)return;if(!force&&lsGet("mh_data_ver")===SE.version)return;
  try{const r=await fetch("migrate.json",{cache:"no-store"});if(!r.ok)return;const m=await r.json();let n=0;if(!SE.orgOk(m._org)){toast(SE.orgErr(m._org));return}
    for(const [col,docs] of Object.entries(m)){if(col.startsWith("_"))continue;for(const [id,data] of Object.entries(docs)){
      if(col==="items"&&S.items.some(i=>i.id===id))continue;
      const ref=S.db.collection(col).doc(id);const g=await ref.get();if(g.exists)continue;const d={...data};if(d.by==="")d.by=S.uid||"";await ref.set(d);n++;await hideReplaced(col,id,d)}}
    const u=await applyUpd(m);lsSet("mh_data_ver",SE.version);if(n||u)toast("📦 GitHub से "+n+" नई चीज़ें जुड़ीं"+(u?" · "+u+" सामान के भाव भरे":"")+" (पुराना कुछ नहीं मिटा)")}catch(e){}}
async function migrateOld(){
  if(!S.isOwner||S.demo){toast("सिर्फ मालिक");return}
  try{toast("पुराना डेटा ला रहे हैं…");const r=await fetch("migrate.json",{cache:"no-store"});const m=await r.json();let n=0,skip=0;if(!SE.orgOk(m._org)){toast(SE.orgErr(m._org));return}
    for(const [col,docs] of Object.entries(m)){if(col.startsWith("_"))continue;for(const [id,data] of Object.entries(docs)){const ref=S.db.collection(col).doc(id);const g=await ref.get();if(g.exists){skip++;continue}const d={...data};if(d.by==="")d.by=S.uid||"";await ref.set(d);n++;await hideReplaced(col,id,d)}}
    const u=await applyUpd(m);toast(`✓ ${n} चीज़ें आईं · ${skip} पहले से थीं (नहीं बदलीं)${u?" · "+u+" सामान के भाव भरे":""}`)}catch(err){
    if(/permission/i.test(err.code||err.message||"")){const d=await SE.ownerDiag();toast(d.ok?"अनुमति अब ठीक है — दोबारा दबाएँ":"सर्वर ने मना किया: "+d.why);return}
    toast("नहीं आया: "+(err.message||err.code||""))}
}

$("#who").onclick=()=>{if(!S.demo){$("#sheet").innerHTML=`<div class="scrim" data-close><div class="sheet px" role="dialog" aria-label="बिलर"><div class="grab"></div><div class="sh-head"><h3>👤 ${esc(biller())}</h3><button class="x" data-close aria-label="बंद करें">✕</button></div><p class="note">इस फोन पर अभी आपके नाम से बिल बन रहे हैं${S.isOwner?" (मालिक)":""}।</p>${updBoxHTML()}<button class="big ghost" data-logout>लॉग-आउट — दूसरा व्यक्ति</button><p class="verline">ऐप संस्करण ${esc(SE.version)}${SE.isNative?" · Android":" · वेब"}</p></div></div>`;$("#sheet").onclick=e=>{if(e.target.matches("[data-close]")||e.target.closest("[data-close].x")){closeSheet();return}if(e.target.closest("[data-updnow]")){runUpdate();return}if(e.target.closest("[data-logout]")){closeSheet();logoutStaff()}};return}openBiller()};

/* ---------- data ---------- */
function subBills(){
  if(window.SF)SF.onDate(S.billsDate);
  if(S.demo){paneSoon();return}
  if(S.unsubBills)S.unsubBills();
  S.dayBills=[];
  S.unsubBills=S.db.collection("days/"+S.billsDate+"/bills").onSnapshot(s=>{const got=s.docs.map(d=>d.data()),nos=new Set(got.map(x=>x.no)),gd=S.billsDate;if(S.isOwner)guardQ(()=>guardBills(gd,got));if(S.isOwner&&window.SB&&SB.rateWatch)SB.rateWatch(got);S.dayBills=got.concat(outbox().map(x=>x.bill).filter(x=>x.date===S.billsDate&&!nos.has(x.no)));paneSoon();if(S.tab==="bill")renderBill()},err=>toast("बिल लोड नहीं हुए"));
  S.unsubDay.forEach(f=>{try{f()}catch(e){}});S.stock={};S.kharch=[];S.close=null;const d="days/"+S.billsDate;
  S.unsubDay=[S.db.doc(d+"/meta/stock").onSnapshot(s=>{S.stock=s.exists?s.data():{};if(S.tab!=="day")paneSoon()},()=>{}),
    S.db.collection(d+"/kharch").onSnapshot(s=>{S.kharch=s.docs.map(x=>({id:x.id,...x.data()}));paneSoon(S.tab!=="day")},()=>{}),
    S.db.doc(d+"/meta/close").onSnapshot(s=>{S.close=s.exists?s.data():null;if(S.tab!=="day")paneSoon()},()=>{})];
  if(window.SG)S.unsubDay.push(SG.listen(S.billsDate));
}
function loadDemo(){
  S.demo=true;S.isOwner=true;
  S.items=DEMO_ITEMS.map(([id,name,emoji,cat,unit,sale,cost,hue,barcode,sub,code,mrp,oldSale],i)=>({id,name,emoji,cat,unit,sale,cost,hue,sub,code,mrp,oldSale:oldSale||0,alias:ALIAS[id]||"",barcode:barcode||"",track:!!barcode,min:5,order:i,active:true,photo:SE.bundled.has(id)?"b":""}));
  S.pstock={};
  S.parties=[{id:"jco",name:"JCO मेस",phone:""},{id:"officers",name:"अफसर मेस",phone:""}];
  S.settings={upi:"",payee:"177 MH Canteen",insts:["15 भैरव कैंटीन","मारवाड़ रसोई (होटल)","अमूल स्टोर"]};
}
async function boot(){
  S.staff=lsGet("se_staff");S.view=lsGet("se_view")||"grid";S.sortTop=lsGet("se_sort")!=="0";try{S.top7=JSON.parse(lsGet("se_top7")||"{}")}catch(e){S.top7={}}try{S.bt=JSON.parse(lsGet("se_tabs")||"[]")}catch(e){S.bt=[]}
  try{const old=JSON.parse(lsGet("se_held")||"[]");old.forEach(h=>S.bt.push({mode:h.mode,partyId:h.partyId,inst:h.inst,cust:h.cust,cart:h.cart,ts:h.ts}));lsSet("se_held","[]")}catch(e){}
  if(!S.bt.length)S.bt=[blankTab()];loadTab(0);
  renderTabs();showTab();
  let fb=null;try{fb=await SE.start()}catch(e){console.error(e)}
  if(!fb){loadDemo();showTab();if(!SE.configured)toast("डेमो मोड — Firebase अभी जुड़ा नहीं है");return}
  const db=fb.db;S.db=db;S.isOwner=fb.isOwner;S.uid=fb.uid;S.meName=fb.name;S.staff=fb.name;
  S.user={id:async()=>fb.uid,isOwner:async()=>fb.isOwner,me:async()=>({id:fb.uid,name:fb.name})};
  SE._busy=()=>S.saving||cartTotal()>0;
  renderTabs();
  SE.watchPhotos(()=>paneSoon());
  if(window.SF)SF.onDb(db);
  if(window.SK)SK.onDb(db);
  if(S.isOwner)db.collection("staff").onSnapshot(s=>{S.staffDocs=s.docs.map(d=>({id:d.id,...d.data()}));setSoon()},()=>{});
  setTimeout(()=>SE.checkUpdate(toast),4000);SE.autoUpdateLoop(toast);if(window.SM)SM.watch();SE.beforeUpdate=()=>{try{syncTab()}catch(e){}};
  if(S.isOwner&&!S.demo)setTimeout(autoNewData,6000);
  if(S.isOwner&&!S.demo&&window.SPK)setTimeout(()=>SPK.apply(),9000);
  const sortItems=a=>a.sort((x,y)=>(x.order??999)-(y.order??999)||x.name.localeCompare(y.name,"hi"));
  db.collection("items").onSnapshot(s=>{S.items=sortItems(s.docs.map(d=>({id:d.id,...d.data()})));if(window.SR)SR.addVirtual();if(S.isOwner&&window.SF&&S.items.some(i=>!i.plu))SF.ensurePLU();S.cart.forEach(l=>{const it=item(l.id);if(it&&!l.changed&&!l.free){l.board=priceOf(it);l.rate=l.board;l.cost=+it.cost||0;l.amt=r2(l.qty*l.rate)}});paneSoon();renderCart()},()=>toast("सामान की लिस्ट लोड नहीं हुई"));
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?s.data():{};checkLock();if(S.tab!=="set")paneSoon()});
  if(S.isOwner)db.collection("presence").onSnapshot(s=>{S.presence=s.docs.map(d=>d.data());if(S.tab==="bills")renderBills()},()=>{});
  setTimeout(()=>{flushOutbox();beat();netbar()},1500);
  if(S.isOwner)setTimeout(()=>guardQ(guardInit),2500);
  db.collection("parties").onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));S.parties=all.filter(p=>!p.deleted);S.partiesDel=all.filter(p=>p.deleted);if(window.SR&&SR.watchDel)SR.watchDel(S.partiesDel);paneSoon()});
  db.collection("ledger").onSnapshot(s=>{S.ledger=s.docs.map(d=>({id:d.id,...d.data()}));paneSoon();if(S.isOwner)guardQ(guardLedger)});
  db.collection("pstock").onSnapshot(s=>{S.pstock={};s.docs.forEach(d=>S.pstock[d.id]=d.data());billSoon();if(S.tab==="day"&&!$("#p-day").contains(document.activeElement))renderDay()},()=>{});
  db.collection("customers").onSnapshot(s=>{S.customers=s.docs.map(d=>({id:d.id,...d.data()}));billSoon()},()=>{});
  if(S.isOwner)db.collection("priceLog").orderBy("ts","desc").limit(30).onSnapshot(s=>{S.priceLog=s.docs.map(d=>d.data())},()=>{});
  subBills();
  showTab();
  loadTop7();
}
async function loadTop7(){
  if(lsGet("se_top7d")===today()&&Object.keys(S.top7||{}).length)return;
  try{const ds=[];for(let i=0;i<=14;i++){const x=new Date();x.setDate(x.getDate()-i);ds.push(today(x))}
    const all=await Promise.all(ds.map(d=>S.db.collection("days/"+d+"/bills").get().then(q=>q.docs.map(x=>x.data())).catch(()=>[])));
    const sc={};all.flat().forEach(b=>{if(b.cancelled)return;const seen=new Set();(b.lines||[]).forEach(l=>{if(!seen.has(l.id)){seen.add(l.id);sc[l.id]=(sc[l.id]||0)+1}})});
    if(Object.keys(sc).length){S.top7=sc;lsSet("se_top7",JSON.stringify(sc));lsSet("se_top7d",today());if(S.tab==="bill"&&!$("#p-bill").contains(document.activeElement))renderBill()}
  }catch(e){}
}
boot();
