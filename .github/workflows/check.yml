# जाँच: Firebase (लॉगिन, डोमेन, नियम) और GitHub Pages — नतीजा checks/report.txt में
name: check
on:
  push:
    paths: [".github/check-request"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check
        run: |
          K=AIzaSyBhvxZD72IquK2VFda9IbtWuDd5kh4EpPY; P=mh177-canteen; F=https://firestore.googleapis.com/v1/projects/$P/databases/\(default\)/documents
          mkdir -p checks; R=checks/report.txt; date -u > $R
          echo "== authorized domains ==" >> $R
          curl -s "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=$K" -H "Referer: https://177mhwcanteen-cyber.github.io/" >> $R; echo >> $R
          echo "== email/password provider ==" >> $R
          curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$K" -H 'Content-Type: application/json' -d '{"email":"no-such-user-check@example.com","password":"x12345","returnSecureToken":true}' | head -c 400 >> $R; echo >> $R
          echo "== rules: settings/main without login (expect PERMISSION_DENIED) ==" >> $R
          curl -s "$F/settings/main?key=$K" | head -c 300 >> $R; echo >> $R
          echo "== rules: staffIndex without login (expect NOT_FOUND = rule allows) ==" >> $R
          curl -s "$F/staffIndex/0000000000?key=$K" | head -c 300 >> $R; echo >> $R
          echo "== rules: items without login (expect PERMISSION_DENIED) ==" >> $R
          curl -s "$F/items/k1001?key=$K" | head -c 300 >> $R; echo >> $R
          echo "== pages ==" >> $R
          curl -s -o /dev/null -w "index %{http_code}\n" https://177mhwcanteen-cyber.github.io/177-MH-/ >> $R
          curl -s https://177mhwcanteen-cyber.github.io/177-MH-/config.js | grep -o 'projectId: "[^"]*"' >> $R || true
          curl -s https://177mhwcanteen-cyber.github.io/177-MH-/build.js >> $R; echo >> $R
          echo "== update ==" >> $R
          V=$(curl -s "https://177mhwcanteen-cyber.github.io/177-MH-/update/version.json?t=$RANDOM"); echo "$V" >> $R
          U=$(echo "$V" | python3 -c 'import sys,json;print(json.load(sys.stdin)["url"])')
          curl -s -o /tmp/b.zip -w "zip %{http_code} %{size_download} bytes %{content_type}\n" "https://177mhwcanteen-cyber.github.io/177-MH-/$U" >> $R
          curl -sI "https://177mhwcanteen-cyber.github.io/177-MH-/$U" | head -12 >> $R
          unzip -l /tmp/b.zip | tail -3 >> $R || echo "unzip fail" >> $R
          echo "== gemini reachability (no key, expect 403/400 quickly) ==" >> $R
          curl -s -m 20 -o /dev/null -w "models %{http_code} %{time_total}s\n" https://generativelanguage.googleapis.com/v1beta/models >> $R
          echo "== sentry test event ==" >> $R
          ID=$(python3 -c "import uuid;print(uuid.uuid4().hex)")
          printf '{"event_id":"%s"}\n{"type":"event"}\n{"event_id":"%s","platform":"javascript","level":"info","message":"177 MH app-watch setup test","release":"mh177@setup","environment":"setup"}\n' $ID $ID > /tmp/env.txt
          curl -s -m 20 -w " sentry %{http_code}\n" -X POST "https://o4512374822797312.ingest.us.sentry.io/api/4512374836559872/envelope/?sentry_key=43706bc0b739a0a6488a0f0f4b609736&sentry_version=7" -H "Content-Type: text/plain" --data-binary @/tmp/env.txt >> $R
          ls >> /dev/null
          git config user.name "check-bot"; git config user.email "check-bot@users.noreply.github.com"
          git add checks/report.txt; git commit -m "जाँच का नतीजा [skip ci]" && git push
